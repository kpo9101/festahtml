      [T('유인력','Attraction'), [[T('낮음','Low'),'#0d59d9'],[T('보통','Fair'),'#1ad99e'],[T('높음','High'),'#fad33d'],[T('매우 높음','Very high'),'#ff6b29'],[T('최고','Peak'),'#fa1a47']]],

  refreshEvents(){
    const list = $('#evlist'); if(!list) return;
    list.innerHTML = '';
    const evs = W.events.slice().sort((a,b)=>(b.def.sev - a.def.sev) || (a.t - b.t));
    const active = evs.filter(e=>!e.done).length;
    const cnt = $('#evcount'); if(cnt) cnt.textContent = active ? ' '+active : '';
    if(!evs.length){
      list.appendChild(el('div',{style:{fontSize:'.78em',color:'var(--ink-3)',padding:'10px 4px',textAlign:'center'},
        text: W.stage==='live' ? T('현재 사건 없음 — 안정적입니다','No incidents — all clear') : T('개장 후 사건이 발생합니다','Incidents occur once open')}));
      return;
    }
    for(const ev of evs){
      const d = ev.def;
      const n = el('div',{class:'ev'+(ev.done?' resolved':'')+(d.good?' good':(' sev'+d.sev))});
      const sevTxt = d.good ? T('기회','BONUS') : (d.sev>=3?T('심각','HIGH'):(d.sev===2?T('주의','MED'):T('경미','LOW')));
      n.appendChild(el('div',{class:'ev-h'},
        el('span',{class:'g',text:d.g}),
        el('b',{text:LANG==='ko'?d.ko:d.en}),
        el('span',{class:'sev',text:sevTxt})));
      n.appendChild(el('p',{text:LANG==='ko'?d.desc.ko:d.desc.en}));
      const act = el('div',{class:'ev-a'});
      if(ev.done){
        act.appendChild(el('span',{class:'tag '+(ev.resolved?'ok':'dan'),
          text: ev.resolved?('✓ '+T('해결됨','Resolved')):('✕ '+T('미대응','Missed'))}));
      } else if(ev.working){
        act.appendChild(el('div',{class:'ev-work'}, el('i',{class:'spin'}),
          el('span',{text:T('대응 중','Working')+' '+Math.round(clamp01(ev.workT/d.dur)*100)+'%'})));
      } else if(ev.assigned >= d.staff){
        act.appendChild(el('div',{class:'ev-work'}, el('i',{class:'spin'}), el('span',{text:T('스태프 이동 중','Staff en route')})));
      } else {
        const need = d.staff - ev.assigned;
        const can = W.freeStaff() >= need && (!d.cost || W.canAfford(d.cost));
        const b = el('button',{class:'btn sm '+(d.good?'gold':'pri'), html:'👷 '+T('스태프 배치','Dispatch')+' ×'+need,
          onclick:()=>{
            const r = assignToEvent(ev);
            if(!r.ok){ AUDIO.sfx('error'); FX.pushToast('⛔ '+(r.reason==='NO_STAFF'?T('가용 스태프가 없습니다','No staff available'):reasonText(r.reason)),'err'); }
            this.refreshEvents();
          }});
        b.disabled = !can;
        act.appendChild(b);
        act.appendChild(el('span',{class:'need',text:(d.cost?('◆'+d.cost+' · '):'')+'~'+Math.round(d.dur)+'s'}));
      }
      const zb = el('button',{class:'btn sm ghost',text:'⌖',onclick:()=>{ CAM.ttx=ev.x; CAM.ttz=ev.z; CAM.tdist=Math.min(CAM.tdist,42); AUDIO.sfx('hover'); }});
      this.tip(zb, T('사건 위치로 카메라 이동','Focus camera on incident'));
      act.appendChild(zb);
      n.appendChild(act);
      if(!ev.done){
        const frac = clamp01(1 - ev.t/ev.life);
        n.appendChild(el('div',{class:'ev-timer',style:{width:(frac*100)+'%',background: ev.working?'var(--accent)':(frac<0.3?'var(--danger)':'var(--warn)')}}));
      }
      if(d.mitigate && d.mitigate.length && !ev.done && ev.mit > 0.05){
        n.appendChild(el('div',{style:{fontSize:'.7em',color:'var(--ok)',marginTop:'4px'},
          text:'✓ '+(LANG==='ko'?d.mitigateText.ko:d.mitigateText.en)+' '+T('효과 적용 중','mitigation active')+' ('+Math.round(ev.mit*100)+'%)'}));
      }
      list.appendChild(n);
    }
  },
  refreshSNS(){
    const list = $('#snslist'); if(!list) return;
    list.innerHTML = '';

  /* ---------- per-frame refresh ---------- */
  tick(dt){
    if(W.stage==='title') return;
    const $$$ = id => this.els[id] || (this.els[id] = document.getElementById(id));
    const set = (id,v)=>{ const n=$$$(id); if(n && n.textContent!==v) n.textContent = v; };
    set('clocktxt', fmtClock(W.clock));
    set('daytxt', 'DAY '+W.day);
    set('stagetxt', stageName(W.stage) + (W.stage==='live'&&W.showActive? ' · '+T('메인 공연','MAIN SHOW') : ''));
    set('slottxt', T('슬롯','Slot')+' '+(W.slot+1)+'/4');
    set('goldtxt', fmtInt(W.gold));
    set('stafftxt', W.freeStaff()+'/'+W.staff);
    const gr = $$$('goldres');
    if(gr){
      const broke = W.gold < 0;
      if(broke !== this._broke){
        this._broke = broke;
        gr.style.color = broke ? 'var(--danger)' : '';
        gr.title = broke ? T('긴급 구제 대출 상태 — 신규 건설과 고용이 제한됩니다','Emergency relief loan — new construction and hiring are blocked') : '';
        if(broke) FX.pushToast('🏦 '+T('긴급 구제 대출 상태 — 최소 운영으로 3일을 마칩니다','Emergency relief loan — you will finish the three days in reduced operation'),'warn',5200);
      }
    }
    const cc = $$$('crowdcount'); if(cc) cc.textContent = fmtInt(W.npcs.length);
    /* slot dots */
    const dots = $$$('slotdots');
    if(dots) for(let i=0;i<4;i++){
      const d = dots.children[i];
      d.classList.toggle('done', i < W.slot);
      d.classList.toggle('cur', i === W.slot);
      if(i===W.slot) d.style.setProperty('--p', (W.slotProgress()*100).toFixed(0)+'%');
    }
    /* metrics */
    const setM = (id, val, max, delta, risk) => {
      const n = $$$('m_'+id); if(!n) return;
      const v = n.querySelector('.v'), b = n.querySelector('.bar i'), dEl = n.querySelector('.d');
      const s = Math.round(val);
      if(v.textContent !== String(s)) v.textContent = s;
      b.style.width = clamp01(val/max)*100+'%';
      if(delta !== undefined && dEl){
        const t = delta>0.4?'▲':(delta<-0.4?'▼':'');
        dEl.textContent = t;
        dEl.className = 'd '+(delta>0.4?'up':(delta<-0.4?'dn':''));
      }
      n.dataset.risk = risk||0;
    };
    this._prev = this._prev || { sat:W.metrics.sat, saf:W.metrics.safety, buzz:W.metrics.buzz };
    const liveSat = this.liveSat();
    setM('sat', liveSat, 100, liveSat-this._prev.sat, liveSat<40?2:(liveSat<58?1:0));
    setM('saf', W.metrics.safety, 100, W.metrics.safety-this._prev.saf, W.metrics.safety<45?2:(W.metrics.safety<65?1:0));
    setM('buzz', W.metrics.buzz, 100, W.metrics.buzz-this._prev.buzz, 0);
    const goal = BAL.dayGoals[clamp(W.day-1,0,2)];
    setM('rev', W.revenueToday, goal, 0, 0);
    const rv = $$$('m_rev'); if(rv) rv.querySelector('.v').textContent = fmtInt(W.revenueToday);
    if(!this._mt || performance.now()-this._mt > 1400){
      this._prev = { sat:liveSat, saf:W.metrics.safety, buzz:W.metrics.buzz };
      this._mt = performance.now();
    }
    /* place bar reason */
    if(BUILD.mode && BUILD.mode!=='__remove'){
      const w = $$$('placewhy');
      if(w){
        const ok = BUILD.valid==='OK';
        w.className = 'why'+(ok?' ok':'');
        w.textContent = ok ? ('✓ '+T('배치 가능','OK')) : ('✕ '+reasonText(BUILD.valid));
      }
    }
    /* periodic panel refresh */
    this._opsT = (this._opsT||0) + dt;
    if(this._opsT > 0.45){
      this._opsT = 0;
      if(!BUILD.canBuild()) this.refreshOps();
      this.refreshSpeed();
      if(BUILD.selected) this.refreshInspector();
    }
  },
  liveSat(){
    if(!W.npcs.length) return W.metrics.sat;
    let s=0; for(const n of W.npcs) s += n.sat;
    const live = s/W.npcs.length;
    return lerp(W.metrics.sat, live, 0.72);
  },

        const fl = W.facilities.filter(f=>f.uses>0 || f.revenue>0).sort((a,b)=>b.revenue-a.revenue);

        b.appendChild(ft);

        f.appendChild(el('div',{class:'muted',style:{fontSize:'.84em'},
          html:T('잔액','Balance')+' <b class="gold-t">'+fmtInt(W.gold)+'</b>'}));
        f.appendChild(this.sp());
        f.appendChild(el('button',{class:'btn lg pri',
          html: W.day>=3 ? ('🎆 '+T('피날레 준비','Prepare the finale')+' →') : (T('Day '+(W.day+1)+'로','To Day '+(W.day+1))+' →'),
          onclick:()=>{ this.closeModal(); nextDayOrFinale(); }}));
      }
    });
  }

    this.dur = W.finaleTier === 0 ? 42 : 96;
    setStage('finale');
    W.clock = 1320; ATMO.update(22.0); ATMO.weather = 'clear';
    /* repopulate a celebration crowd in front of the stage */
    for(let i=W.npcs.length-1;i>=0;i--) despawnNPC(W.npcs[i], i);
    const target = Math.min(W.maxNpc, 240 + W.finaleTier*40);
    for(let i=0;i<target;i++){
      const n = spawnNPC();
      if(!n) break;
      const sp = showSpot(n);
      n.x = sp.x; n.z = sp.z;
      n.state = ST.WATCH; n.watchX = sp.x; n.watchZ = sp.z; n.watchT = 0;
      n.dwell = 1e9; n.age = 0;
    }
    W.gold += 0; /* tickets already counted; finale crowd is a visual encore */
    W.revenueToday = W.revenueToday;
    $('#finaleui').classList.add('on');
    $('#ui').style.opacity = '0';
    $('#ui').style.pointerEvents = 'none';
    SCENE.hide();
    AUDIO.setScene('finale');
    AUDIO.setCrowd(1);
    RD.heatMode = -1;
    /* build fireworks timeline */
    const shells = this.tier.shells;
    const R = makeRNG(4242 + W.finaleTier);
    const start = W.finaleTier===0 ? 22 : 26;
    const span = this.dur - start - 6;
    const COLORS = ['#ff5f6d','#ffd166','#4fe8c0','#6cb6ff','#ff9ec0','#d197f7','#ffffff','#f7bb97'];
    const SHAPES = ['burst','burst','ring','willow','heart'];
    for(let i=0;i<shells;i++){
      const p = i/Math.max(1,shells-1);
      const t = start + Math.pow(p, 0.82)*span + R.range(-0.8,0.8);
      this.timeline.push({
        t, x: R.range(-58,58), y: R.range(26,52), z: R.range(6,34),
        col: R.pick(COLORS),
        power: (W.finaleTier>=3? R.int(70,130) : R.int(38,78)),
        shape: W.finaleTier>=2 ? R.pick(SHAPES) : (R.chance(0.25)?'ring':'burst'),
        fired:false
      });
    }
    /* grand finale volley */
    if(W.finaleTier >= 1){
      for(let i=0;i<8+W.finaleTier*7;i++){
        this.timeline.push({ t: this.dur-5.2 + i*0.12, x:R.range(-48,48), y:R.range(30,54), z:R.range(8,30),
          col:R.pick(COLORS), power: W.finaleTier>=3?150:90, shape:R.pick(SHAPES), fired:false });
      }
    }
    this.timeline.sort((a,b)=>a.t-b.t);
    /* camera path */
    const S = W.mainStage;
    const keys = [
      { eye:[S.x+62, 3.2, S.z+42], tgt:[S.x+8, 6, S.z], fov:44 },
      { eye:[S.x+34, 8, S.z+26], tgt:[S.x+4, 7, S.z], fov:42 },
      { eye:[10, 5.5, 14], tgt:[S.x+10, 5, S.z+2], fov:52 },
      { eye:[6, 22, 30], tgt:[-6, 10, -2], fov:50 },
      { eye:[-14, 34, 44], tgt:[-4, 16, 4], fov:54 },
      { eye:[26, 46, 58], tgt:[-6, 22, 6], fov:56 },
      { eye:[0, 58, 76], tgt:[0, 26, 4], fov:58 },
      { eye:[-40, 30, 52], tgt:[S.x+6, 18, S.z+4], fov:50 },
      { eye:[0, 16, 40], tgt:[0, 30, -6], fov:62 },
      { eye:[0, 8, 26], tgt:[0, 34, -10], fov:68 },
    ];
    CAM.startCine(keys, this.dur, ()=>{});
    const banner = $('#finaleui .fban');
    setTimeout(()=>{
      banner.querySelector('b').textContent = LANG==='ko'?'부산 바다축제':'Busan Sea Festival';
      banner.querySelector('span').textContent = LANG==='ko'?'그랜드 피날레':'Grand Finale';
      banner.classList.add('on');
      setTimeout(()=>banner.classList.remove('on'), 5200);
    }, 900);
    FX.pushToast('🎆 '+T('피날레 시작','Finale begins'),'gold');
    AUDIO.sfx('cheer');
  },
  update(dt){
    if(!this.active) return;
    this.t += dt;
    /* stage light sweep + crowd cheer particles */
    const S = W.mainStage;
    if(Math.random() < dt*18){
      FX.p(S.x + W.rng.range(-8,8), 12 + W.rng.range(0,4), S.z + W.rng.range(-5,5),
           W.rng.range(-1,1), W.rng.range(0.4,1.6), W.rng.range(-1,1), 1.6, 0.6,
           1,0.85,0.5, {grav:0.2, drag:0.9, alpha:0.22, grow:1.6, add:true});
    }
    if(Math.random() < dt*4){
      const n = W.rng.pick(W.npcs);
      if(n) FX.sparkle(n.x, 2.0, n.z, '#ffd166', 1);
    }
    for(const s of this.timeline){
      if(!s.fired && this.t >= s.t){
        s.fired = true; this.fired++;
        FX.rocket(s.x*0.4, s.z+20, s.x, s.y, s.z, s.col, s.power, s.shape, 0);
        FX.camShake(0.10 + s.power*0.0008, 0.35);
      }
    }
    RD.flash = damp(RD.flash, 0, 4.5, dt);
    RD.aberr = 0.24 + Math.sin(this.t*0.7)*0.12;
    if(this.t >= this.dur && !this.skipped) this.finish();
  },
  skip(){
    if(!this.active || this.skipped) return;
    this.skipped = true;
    this.finish();
  },
  finish(){
    if(!this.active) return;
    this.active = false;
    RD.aberr = 0; RD.flash = 0;
    $('#finaleui').classList.remove('on');
    $('#finaleui .fban').classList.remove('on');
    $('#ui').style.opacity = '';
    $('#ui').style.pointerEvents = '';
    CAM.mode = 'overview';
    CAM.ttx = W.mainStage.x + 22; CAM.ttz = W.mainStage.z + 10; CAM.tdist = 64; CAM.tpitch = 0.8;
    AUDIO.setScene('report');
    setStage('final');
    UI.openFinalReport();
  }
};

/* ===========================================================================
   35. MINIGAMES
   Three separate festival games behind one controller. Each supplies its own
   init/update/draw/hud; MINI owns the shared countdown, clock, scoring and
   reward payout. The Live simulation keeps running underneath throughout,
   per the design document's time policy.
   =========================================================================== */
const MINIGAMES = [
  {
    id:'surf', ko:'다대포 서핑', en:'Dadaepo Surf', g:'🏄', fac:'surfschool',
    dur:52, scene:'ocean', scoreRef:2100,

           en:'Ride the swell, dodge obstacles, collect rings. Every turn costs balance — weigh greed against staying upright.' },
    keys:{ ko:'<span class="kbd">A</span><span class="kbd">D</span> 좌우 이동 · 균형',
           en:'<span class="kbd">A</span><span class="kbd">D</span> steer &amp; balance' },
    init(M){
      M.x=-180; M.z=M.courseZ; M.speed=16; M.lane=0; M.tilt=0; M.tiltV=0;
      M.wipe=0; M.obstacles=[]; M.pickups=[]; M.nextSpawn=0; M.rings=0; M.hits=0;
    },
    update(M,dt){
      let steer=0;
      if(IN.key('a')||IN.key('ArrowLeft')) steer-=1;
      if(IN.key('d')||IN.key('ArrowRight')) steer+=1;
      M.speed=Math.min(34,M.speed+dt*0.85);
      M.lane=clamp(M.lane+steer*dt*11,-9.5,9.5);
      M.tiltV+=steer*dt*2.6;
      M.tiltV-=M.tilt*dt*3.4;
      M.tiltV+=Math.sin(M.t*1.7)*dt*0.38;
      M.tiltV+=Math.sin(M.t*0.61+1.3)*dt*0.22;
      M.tiltV*=Math.exp(-dt*1.7);
      M.tilt=clamp(M.tilt+M.tiltV*dt*2.4,-1.6,1.6);
      M.x+=M.speed*dt; M.z=M.courseZ+M.lane;
      M.score+=dt*M.speed*0.30*M.combo;
      M.nextSpawn-=dt;
      if(M.nextSpawn<=0){
        M.nextSpawn=lerp(0.74,0.36,clamp01(M.t/M.dur))*M.rng.range(0.78,1.38);
        const ahead=M.x+92;
        if(M.rng.chance(0.52)) M.obstacles.push({x:ahead,l:M.rng.range(-9,9),kind:M.rng.int(0,2),hit:false});
        else M.pickups.push({x:ahead,l:M.rng.range(-8.5,8.5),got:false,ph:M.rng.range(0,TAU)});
      }
      for(const o of M.obstacles){
        if(o.hit||o.x<M.x-8) continue;
        if(Math.abs(o.x-M.x)<1.5 && Math.abs(o.l-M.lane)<1.5){
          o.hit=true; M.hits++; M.combo=1;
          M.score=Math.max(0,M.score-30); M.speed=Math.max(11,M.speed*0.62);
          M.tiltV+=(M.lane>o.l?1:-1)*1.9;
          FX.camShake(0.5,0.4); FX.burst(M.x,M.z,'#ff5f6d',22,-0.2);
          AUDIO.sfx('fail'); FX.floatWorld(M.x,M.z,'-30','#ff5f6d',2.4);
        }
      }
      for(const q of M.pickups){
        if(q.got||q.x<M.x-8) continue;
        if(Math.abs(q.x-M.x)<1.7 && Math.abs(q.l-M.lane)<1.8){
          q.got=true; M.rings++;
          M.combo=Math.min(3,M.combo+0.25);
          M.score+=22*M.combo;
          AUDIO.sfx('point'); FX.sparkle(M.x,0.6,M.z,'#ffd166',14);
          FX.floatWorld(M.x,M.z,'+'+Math.round(22*M.combo),'#ffd166',2.4);
        }
      }
      const bal=$('#mgbal');
      const danger=Math.abs(M.tilt)>0.92;
      bal.classList.remove('hide');
      bal.classList.toggle('danger',danger);
      if(danger) M.wipe+=dt; else M.wipe=Math.max(0,M.wipe-dt*1.6);
      if(M.wipe>0.75){
        M.wipe=0; M.tilt=0; M.tiltV=0; M.combo=1;
        M.score=Math.max(0,M.score-60); M.speed=12;
        FX.camShake(0.85,0.6); FX.burst(M.x,M.z,'#7fe0ec',40,0.1);
        AUDIO.sfx('splash'); FX.floatWorld(M.x,M.z,T('전복!','WIPEOUT!'),'#ff5f6d',3);
      }
      if(M.obstacles.length>40) M.obstacles.splice(0,12);
      if(M.pickups.length>40) M.pickups.splice(0,12);
      $('#mgneedle').style.left=(50+M.tilt*31)+'%';
      $('#mgballab').textContent=danger?T('균형을 잡으세요!','REGAIN BALANCE!'):T('균형 · BALANCE','BALANCE');
      if(Math.random()<dt*40){
        FX.p(M.x-1.2,0.1,M.z+(Math.random()-0.5)*1.6,
             -M.speed*0.25+(Math.random()-0.5)*3,1.2+Math.random()*2.4,(Math.random()-0.5)*3,
             0.5,0.16,0.92,0.98,1,{grav:-7,drag:1.4,add:false,alpha:0.7});
      }
      const back=13,up=5.2;
      CAM.eye[0]=damp(CAM.eye[0],M.x-back,8,dt);
      CAM.eye[1]=damp(CAM.eye[1],up,6,dt);
      CAM.eye[2]=damp(CAM.eye[2],M.z-M.lane*0.35,6,dt);
      CAM.tgt[0]=M.x+9; CAM.tgt[1]=1.0; CAM.tgt[2]=M.z+M.lane*0.15;
      CAM.fov=62+clamp01((M.speed-16)/20)*12;
    },
    draw(M,dt){
      const tiltA=M.tilt*0.5, y=0.25+Math.sin(M.t*3.1)*0.10;
      M4.trs(TMP,M.x,y,M.z,0,PI/2,tiltA,1.15,1.15,1.15);
      RD.mNC('surfboard',TMP,0.96,0.98,1,0,0.8,1,0,0);
      const hip=y+0.42, lean=(CH.neck-CH.hip);
      M4.trs(TMP,M.x,hip,M.z,0,PI/2,tiltA*0.7,1,1,1);
      RD.mNC('npc_body',TMP,0.81,0.94,1.0,0,0.5,1,0,0);
      M4.trs(TMP,M.x-Math.sin(tiltA)*lean,hip+lean,M.z,0,PI/2,tiltA*0.7,1,1,1);
      RD.mNC('npc_head',TMP,0.98,0.84,0.74,0,0.5,1,0,0);
      RD.mNC('npc_hair',TMP,0.29,0.23,0.19,0,0.5,1,0,0);
      RD.mNC('npc_cap',TMP,1.0,0.62,0.70,0,0.5,1,0,0);
      RD.decal(M.x-3,M.z,3.4,1.3,0,1,1,1,0.34,2,0.1,0);
      for(const o of M.obstacles){
        if(o.x<M.x-14||o.x>M.x+110) continue;
        const oz=M.courseZ+o.l, bob=Math.sin(RD.time*1.8+o.x*0.3)*0.14;
        if(o.kind===0){ M4.trsY(TMP,o.x,-0.5+bob,oz,o.x,1.4,1.4,1.4);

        else if(o.kind===1){ M4.trsY(TMP,o.x,-0.35+bob,oz,RD.time*0.9,1.3,1.3,1.3);
          RD.mNC('buoy',TMP,1,0.32,0.22,o.hit?0:0.5,0.6,1,0,0); }
        else { M4.trsY(TMP,o.x,-0.15+bob,oz,RD.time*0.6,1.2,1.2,1.2);

        if(!o.hit) RD.decal(o.x,oz,1.6,1.6,0,1,0.35,0.35,0.32,1,0.1,o.x);
      }
      for(const q of M.pickups){
        if(q.got||q.x<M.x-14||q.x>M.x+110) continue;
        const pz=M.courseZ+q.l;
        M4.trs(TMP,q.x,0.85+Math.sin(RD.time*2.4+q.ph)*0.22,pz,0,RD.time*1.6,0,1,1,1);
        RD.mNC('ring',TMP,1,0.82,0.4,2.2,0.5,1,0,0);

        +'<div class="mg-stat"><div class="l">'+T('콤보','Combo')+'</div><div class="v" style="color:var(--accent-2)">×'+M.combo.toFixed(1)+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('속도','Speed')+'</div><div class="v">'+Math.round(M.speed*3.6)+'</div></div>'

  {
    id:'fireworks', ko:'불꽃 타이밍', en:'Fireworks Timing', g:'🎆', fac:'mainstage',

           en:'Detonate each shell at its apex. Hit space the instant the shrinking ring meets the core.' },
    keys:{ ko:'<span class="kbd">Space</span> 격발',

    init(M){
      M.shells=[]; M.nextShell=1.2; M.perfect=0; M.good=0; M.missed=0; M.armed=true;
      const S=W.mainStage;
      M.origin={x:S.x+9,z:S.z};
      CAM.eye[0]=S.x+30; CAM.eye[1]=6.5; CAM.eye[2]=S.z+16;
      $('#mgbal').classList.add('hide');
    },
    spawn(M){
      const R=M.rng;
      const rise=R.range(1.15,1.65);
      M.shells.push({
        x:M.origin.x+R.range(-11,11), z:M.origin.z+R.range(-7,7),
        y0:1.5, apex:R.range(20,30), t:0, rise, judged:false, dead:false,
        col:R.pick(['#ff5f6d','#ffd166','#4fe8c0','#6cb6ff','#ff9ec0','#b06ce0','#ffffff'])
      });
      AUDIO.sfx('launch');
    },
    update(M,dt){
      if(M.phase==='run') M.nextShell-=dt;
      if(M.phase==='run' && M.nextShell<=0 && M.t < M.dur-2.0){
        M.nextShell=lerp(1.85,1.05,clamp01(M.t/M.dur))*M.rng.range(0.9,1.15);
        this.spawn(M);
      }
      const press = M.phase==='run' && IN.keys.has(' ') && M.armed;
      if(!IN.keys.has(' ')) M.armed = true;
      let judgedThis = false;
      for(const sh of M.shells){
        if(sh.dead) continue;
        sh.t+=dt;
        const f=clamp01(sh.t/sh.rise);
        sh.y=sh.y0+(sh.apex-sh.y0)*(1-(1-f)*(1-f));   // ease-out rise
        if(Math.random()<dt*40 && !sh.judged)
          FX.p(sh.x,sh.y,sh.z,(Math.random()-0.5)*0.7,-1.2,(Math.random()-0.5)*0.7,0.45,0.13,
               1.0,0.66,0.28,{grav:-1,drag:1.6,kind:0,fade:2});
        if(!sh.judged && press && !judgedThis){
          judgedThis=true; M.armed=false; sh.judged=true;
          const d=Math.abs(sh.t-sh.rise);
          let grade,pts;
          if(d<0.10){ grade='PERFECT'; pts=60; M.perfect++; M.combo=Math.min(3,M.combo+0.26); }
          else if(d<0.26){ grade='GOOD'; pts=28; M.good++; M.combo=Math.min(3,M.combo+0.11); }
          else { grade='EARLY'; pts=6; M.combo=1; }
          const gain=Math.round(pts*M.combo);
          M.score+=gain;
          const shape = grade==='PERFECT' ? W.rng.pick(['burst','ring','willow','heart']) : 'burst';
          FX.firework(sh.x,sh.y,sh.z,sh.col, grade==='PERFECT'?95:(grade==='GOOD'?58:26), shape);

          const sp=CAM.projectToScreen(sh.x,sh.y,sh.z);

            grade==='PERFECT'?'#ffd166':(grade==='GOOD'?'#4fe8c0':'#ff9b6b'));
          AUDIO.sfx(grade==='PERFECT'?'resolve':'point');
          sh.dead=true;
        }
        if(!sh.judged && sh.t>sh.rise+0.42){
          sh.judged=true; sh.dead=true; M.missed++; M.combo=1;
          const sp=CAM.projectToScreen(sh.x,sh.y,sh.z);
          if(sp) FX.floatScreen(sp.x,sp.y,T('불발','MISS'),'#ff5f6d');
          FX.smoke(sh.x,sh.y,sh.z,5,true);
          AUDIO.sfx('fail');
        }
      }
      M.shells=M.shells.filter(sh=>!sh.dead||sh.t<sh.rise+2);

      const S=W.mainStage, a=M.t*0.06;

      CAM.eye[1]=damp(CAM.eye[1],6.5,1.4,dt);
      CAM.eye[2]=damp(CAM.eye[2],S.z+17+Math.cos(a)*4,1.4,dt);
      CAM.tgt[0]=S.x+9; CAM.tgt[1]=18; CAM.tgt[2]=S.z;
      CAM.fov=58;
    },
    draw(M,dt){

        const c=hex2rgb(sh.col);

        RD.mNC('bulb',TMP,c[0],c[1],c[2],3.2,0.5,1,0,0);
        /* timing ring: shrinks onto the shell, meeting it exactly at apex */
        const f=clamp01(sh.t/sh.rise);
        const r=lerp(3.4,0.62,f*f);
        M4.trs(TMP,sh.x,sh.y,sh.z,PI/2,0,0,r,r,r);
        const near=Math.abs(sh.t-sh.rise)<0.12;
        RD.mNC('ring',TMP, near?1:0.75, near?0.85:0.85, near?0.35:1.0, near?3.0:1.1, 0.5,1,0,0);
      }
    },
    hud(M){
      return '<div class="mg-stat"><div class="l">'+T('점수','Score')+'</div><div class="v" style="color:var(--gold)">'+Math.round(M.score)+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('콤보','Combo')+'</div><div class="v" style="color:var(--accent-2)">×'+M.combo.toFixed(2)+'</div></div>'
        +'<div class="mg-stat"><div class="l">PERFECT</div><div class="v" style="color:var(--gold)">'+M.perfect+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('불발','Miss')+'</div><div class="v" style="color:var(--danger)">'+M.missed+'</div></div>';
    }
  },
  {
    id:'pocha', ko:'포차 러시', en:'Pocha Rush', g:'🦐', fac:'pocha',
    dur:50, scene:'festival', scoreRef:9000,
    desc:{ ko:'주문이 밀려옵니다. 화면에 뜬 순서대로 1~4번 조리대를 눌러 접시를 완성하세요. 틀리면 처음부터입니다.',
           en:'Orders pile up. Hit stations 1–4 in the order shown to plate each dish. One wrong key and the ticket restarts.' },
    keys:{ ko:'<span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span> 조리대',
           en:'<span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span> stations' },
    init(M){
      const f=M.fac||W.facilities.find(x=>x.defId==='pocha')||W.mainStage;
      M.base={x:f.x,z:f.z+5.2};
      M.stations=[0,1,2,3].map(i=>({ x:M.base.x+(i-1.5)*2.0, z:M.base.z, lit:0 }));
      M.order=[]; M.step=0; M.orderT=0; M.orderLimit=6.5; M.cookT=0;
      M.done=0; M.failed=0; M.prevKeys=[false,false,false,false];
      this.newOrder(M);
      $('#mgbal').classList.add('hide');
    },
    newOrder(M){
      const len=clamp(2+Math.floor(M.t/16),2,4);
      M.order=[];
      for(let i=0;i<len;i++) M.order.push(M.rng.int(0,3));
      M.step=0; M.orderT=0;
      M.orderLimit=lerp(7.0,3.8,clamp01(M.t/M.dur))+len*0.55;
    },
    update(M,dt){
      const live = M.phase==='run';
      if(live) M.orderT+=dt;
      M.cookT=Math.max(0,M.cookT-dt);
      for(const st of M.stations) st.lit=Math.max(0,st.lit-dt*3.4);
      const keys=['1','2','3','4'];
      for(let i=0;i<4;i++){
        const down=live && M.cookT<=0 && IN.keys.has(keys[i]);
        if(down && !M.prevKeys[i]){
          M.stations[i].lit=1;
          if(i===M.order[M.step]){
            M.step++; M.cookT=0.22;          /* the station has to actually cook */
            M.score+=4*M.combo;
            AUDIO.sfx('point');
            FX.sparkle(M.stations[i].x,1.5,M.stations[i].z,'#4fe8c0',8);
            if(M.step>=M.order.length){
              M.done++;
              M.combo=Math.min(4,M.combo+0.3);
              const gain=Math.round(30*M.combo);
              M.score+=gain;
              AUDIO.sfx('cash');
              FX.burst(M.base.x,M.base.z,'#ffd166',20,1.6);
              const sp=CAM.projectToScreen(M.base.x,2.6,M.base.z);
              if(sp) FX.floatScreen(sp.x,sp.y,T('완성! ','SERVED! ')+'+'+gain,'#ffd166');
              this.newOrder(M);
            }
          } else {
            M.failed++; M.combo=1; M.step=0;
            M.score=Math.max(0,M.score-10);
            AUDIO.sfx('error'); FX.camShake(0.25,0.2);
            FX.burst(M.stations[i].x,M.stations[i].z,'#ff5f6d',12,1.4);
            const sp=CAM.projectToScreen(M.stations[i].x,1.8,M.stations[i].z);
            if(sp) FX.floatScreen(sp.x,sp.y,T('실수','WRONG'),'#ff5f6d');
          }
        }
        M.prevKeys[i]=down;
      }
      if(live && M.orderT>M.orderLimit){
        M.failed++; M.combo=1;
        M.score=Math.max(0,M.score-14);
        AUDIO.sfx('fail');
        const sp=CAM.projectToScreen(M.base.x,2.6,M.base.z);
        if(sp) FX.floatScreen(sp.x,sp.y,T('주문 취소','WALKED OUT'),'#ff5f6d');
        this.newOrder(M);
      }
      CAM.eye[0]=damp(CAM.eye[0],M.base.x,3,dt);
      CAM.eye[1]=damp(CAM.eye[1],4.1,3,dt);
      CAM.eye[2]=damp(CAM.eye[2],M.base.z+8.6,3,dt);
      CAM.tgt[0]=M.base.x; CAM.tgt[1]=1.3; CAM.tgt[2]=M.base.z;
      CAM.fov=52;
    },
    draw(M,dt){
      const COL=[[1,0.42,0.36],[1,0.82,0.4],[0.31,0.79,0.72],[0.55,0.72,1]];
      for(let i=0;i<4;i++){
        const st=M.stations[i], c=COL[i];
        const isNext = M.order[M.step]===i;
        const em = st.lit*2.6 + (isNext?1.1+Math.sin(RD.time*6)*0.5:0.15);
        M4.trsY(TMP,st.x,terrainH(st.x,st.z),st.z,0,1.5,1.5,1.5);
        RD.mNC('mg_station',TMP,c[0],c[1],c[2],em,0.5,1,0,0);
        if(isNext) RD.decal(st.x,st.z,1.5,1.5,0,c[0],c[1],c[2],0.6,1,0.1,i);
        if(st.lit>0.05) FX.sparkle(st.x,1.6,st.z,'#ffffff',1);
      }
      /* the ticket, floating above the counter */
      for(let i=0;i<M.order.length;i++){
        const c=COL[M.order[i]];
        const doneStep = i<M.step;
        const x=M.base.x+(i-(M.order.length-1)/2)*0.95;
        const y=3.15+Math.sin(RD.time*2+i)*0.05;
        M4.trsY(TMP,x,y,M.base.z-0.4,RD.time*1.2, doneStep?0.34:0.52, doneStep?0.34:0.52, doneStep?0.34:0.52);
        RD.mNC('progmark',TMP,c[0],c[1],c[2], doneStep?0.25:1.9, 0.5,1,0,0);
      }
      /* order timer as a shrinking bar under the ticket */
      const frac=clamp01(1-M.orderT/M.orderLimit);
      RD.decal(M.base.x, M.base.z-1.6, 1.9*frac, 0.20, 0,
               frac<0.3?1:0.35, frac<0.3?0.3:0.9, frac<0.3?0.3:0.8, 0.85, 0, 0.02, 0);
    },
    hud(M){
      return '<div class="mg-stat"><div class="l">'+T('점수','Score')+'</div><div class="v" style="color:var(--gold)">'+Math.round(M.score)+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('콤보','Combo')+'</div><div class="v" style="color:var(--accent-2)">×'+M.combo.toFixed(2)+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('완성','Served')+'</div><div class="v" style="color:var(--ok)">'+M.done+'</div></div>'
        +'<div class="mg-stat"><div class="l">'+T('실수','Errors')+'</div><div class="v" style="color:var(--danger)">'+M.failed+'</div></div>';
    }
  }
];
const MINIGAME_BY = {}; for(const g of MINIGAMES) MINIGAME_BY[g.id]=g;

/* is a game available right now, and if not, why */
function minigameStatus(g){
  if(W.stage!=='live') return { ok:false, why:T('개장 중에만 플레이할 수 있습니다','Only while the festival is live') };
  if(W.minigamePlayed[W.day+':'+g.id]) return { ok:false, why:T('오늘은 이미 플레이했습니다','Already played today') };
  const fac = W.facilities.find(f=>f.defId===g.fac && f.active);
  if(!fac) return { ok:false, why:T((FAC[g.fac]?facName(FAC[g.fac]):g.fac)+' 시설이 필요합니다',
                                    'Requires '+(FAC[g.fac]?facName(FAC[g.fac]):g.fac)) };
  return { ok:true, fac };
}

const MINI = {
  active:false, game:null, fac:null,
  t:0, dur:52, phase:'count', countT:3,
  score:0, combo:1, courseZ:150, rng:null,
  start(gameId, fac){
    if(this.active) return;
    const g = MINIGAME_BY[gameId];
    if(!g){ console.warn('unknown minigame', gameId); return; }
    const st = minigameStatus(g);
    if(!st.ok){ AUDIO.sfx('error'); FX.pushToast('⛔ '+st.why,'err'); return; }
    this.game = g; this.fac = fac || st.fac;
    this.active = true;
    this.t = 0; this.dur = g.dur; this.phase='count'; this.countT=3.2;
    this.score = 0; this.combo = 1;
    this.rng = makeRNG(W.seed + W.day*977 + gameId.length*31);
    W.minigamePlayed[W.day+':'+g.id] = true;
    $('#mghud').classList.add('on');
    $('#mgbal').classList.remove('hide');
    $('#ui').style.opacity='0.15'; $('#ui').style.pointerEvents='none';
    SCENE.hide(); UI.closeModal();
    CAM.mode='mini';
    AUDIO.setScene('minigame');
    RD.heatMode=-1;
    $('#mgkeys').innerHTML = (LANG==='ko'?g.keys.ko:g.keys.en)
      + ' &nbsp;·&nbsp; <span class="kbd">Esc</span> '+T('포기','Quit');
    g.init(this);
    AUDIO.sfx('whoosh');
  },
  quit(){ this.finish(false); },
  finish(complete){
    if(!this.active) return;
    const g = this.game;
    this.active = false; this.game = null;
    $('#mghud').classList.remove('on');
    $('#mgcount').classList.add('hide');
    $('#mgbal').classList.remove('hide');
    $('#ui').style.opacity=''; $('#ui').style.pointerEvents='';
    CAM.mode='overview';
    AUDIO.setScene(W.clock>1140?'night':'live');
    const sc = Math.round(this.score);
    W.minigameBest = Math.max(W.minigameBest, sc);
    if(complete && sc > 0){
      /* a flawless run is worth about a quarter of a good day's profit */
      const ratio = Math.min(1.15, sc/(g.scoreRef||3000));
      const gold = Math.round(ratio*480);
      const buzz = clamp(ratio*13, 0, 13);
      W.tx(gold,'MINIGAME', LANG==='ko'?g.ko:g.en);
      W.buzzEvent(buzz,'MINIGAME');
      W.satEvent(buzz*0.25,'MINIGAME');
      W.gems += Math.floor(ratio*3);
      FX.pushToast(g.g+' '+(LANG==='ko'?g.ko:g.en)+' '+T('완료','complete')
        +' — <b class="gold-t">+'+fmtInt(gold)+'</b> · Buzz +'+buzz.toFixed(0),'gold',4200);
      AUDIO.sfx('resolve');
      pushSNS({ name:T('운영자','Operator'), arch:ARCH_BY.surfer, kind:'pos',
                text:T('운영자가 '+g.ko+'에 직접 나섰다! 점수 '+sc,
                       'The operator took on '+g.en+'! Score '+sc),
                cause:'MINIGAME', day:W.day, clock:W.clock, color:[0.25,0.7,0.88] });
    } else {
      FX.pushToast(g.g+' '+T('중단','abandoned'),'warn');
    }
    UI.buildTopbar();
  },
  update(dt){
    if(!this.active) return;
    if(this.phase==='count'){
      this.countT-=dt;
      const c=$('#mgcount'); c.classList.remove('hide');
      const n=Math.ceil(this.countT);
      if(n!==this._lastCount){ this._lastCount=n; if(n>0) AUDIO.sfx('count'); }
      c.textContent = this.countT>0.35 ? String(Math.max(1,n)) : 'GO!';
      if(this.countT<=-0.5){ this.phase='run'; c.classList.add('hide'); this._lastCount=null; }
      this.game.update(this, 0);
      return;
    }
    this.t += dt;
    this.game.update(this, dt);
    const rem=Math.max(0,this.dur-this.t);
    $('#mgtop').innerHTML = this.game.hud(this)
      + '<div class="mg-stat"><div class="l">'+T('남은 시간','Time')+'</div><div class="v" style="color:'
      + (rem<10?'var(--danger)':'inherit')+'">'+rem.toFixed(1)+'</div></div>';
    if(this.t>=this.dur) this.finish(true);
  },
  draw(dt){
    if(!this.active || !this.game) return;
    this.game.draw(this, dt);
  }
};

const GROUND = {
  target:null, targetKind:'', photo:false, photoT:0, subT:0,
  update(dt){
    if(CAM.mode !== 'ground'){ this.target=null; return; }
    /* find what we're looking at */
    const ex=CAM.eye[0], ez=CAM.eye[2];
    const dx=Math.sin(CAM.gyaw), dz=Math.cos(CAM.gyaw);
    let best=null, bestKind='', bestD=1e9;
    for(const f of W.facilities){
      const vx=f.x-ex, vz=f.z-ez;
      const d=Math.hypot(vx,vz);
      if(d>13) continue;
      const dot=(vx*dx+vz*dz)/(d||1);
      if(dot < 0.80) continue;
      if(d<bestD){ bestD=d; best=f; bestKind='fac'; }
    }
    for(const n of W.npcs){
      const vx=n.x-ex, vz=n.z-ez;
      const d=Math.hypot(vx,vz);
      if(d>7) continue;
      const dot=(vx*dx+vz*dz)/(d||1);
      if(dot < 0.93) continue;
      if(d*0.55 < bestD){ bestD=d*0.55; best=n; bestKind='npc'; }
    }
    for(const ev of W.events){
      if(ev.done) continue;
      const vx=ev.x-ex, vz=ev.z-ez;
      const d=Math.hypot(vx,vz);
      if(d>16) continue;
      const dot=(vx*dx+vz*dz)/(d||1);
      if(dot < 0.82) continue;
      if(d*0.4 < bestD){ bestD=d*0.4; best=ev; bestKind='event'; }
    }
    this.target = best; this.targetKind = bestKind;
    const p = $('#gprompt'), xh = $('#xhair');
    if(best && IN.locked && !UI.modalOpen){
      xh.classList.add('act');
      p.classList.add('on');
      if(bestKind==='fac'){
        const f = best;
        p.innerHTML = '<span class="kbd">E</span> '+f.def.g+' <b>'+facName(f.def)+'</b>'
          + (f.def.queueMax ? ' <span class="muted">'+T('대기','Queue')+' '+f.queue.length+'/'+f.def.queueMax+'</span>' : '')
          + (f.def.minigame && MINIGAME_BY[f.def.minigame]
              ? ' <span style="color:var(--gold)">· '+MINIGAME_BY[f.def.minigame].g+' '
                + (LANG==='ko'?MINIGAME_BY[f.def.minigame].ko:MINIGAME_BY[f.def.minigame].en)+'</span>' : '');
      } else if(bestKind==='npc'){
        const n = best;
        const mood = n.sat>72?'😊':(n.sat<48?'😣':'😐');
        p.innerHTML = '<span class="kbd">E</span> '+mood+' <b>'+n.name+'</b> <span class="muted">'+(LANG==='ko'?n.arch.ko:n.arch.en)
          +' · '+(LANG==='ko'?STNAME[n.state].ko:STNAME[n.state].en)+'</span>';
      } else {
        const ev = best;
        const need = ev.def.staff - ev.assigned;
        p.innerHTML = '<span class="kbd">E</span> '+ev.def.g+' <b>'+(LANG==='ko'?ev.def.ko:ev.def.en)+'</b>'
          + (need>0 ? ' <span style="color:var(--danger)">· '+T('스태프 배치','Dispatch')+' ×'+need+'</span>' : ' <span style="color:var(--accent-2)">· '+T('대응 중','In progress')+'</span>');
      }
    } else {
      xh.classList.remove('act');
      if(IN.locked) p.classList.remove('on');
    }
    /* photo mode */
    if(this.photo){
      this.photoT += dt;
      $('#pfhud').textContent = 'f/2.8   1/'+Math.round(60+Math.sin(this.photoT)*20)+'   ISO 400   '
        + fmtClock(W.clock) + '   DAY '+W.day;
    }
    if(this.subT > 0){ this.subT -= dt; if(this.subT<=0) $('#gsubtitle').classList.remove('on'); }
  },
  interact(){
    if(!this.target) return;
    AUDIO.sfx('click');
    if(this.targetKind==='npc'){
      const n = this.target;
      const q = W.rng.pick(n.arch.quote[LANG] || n.arch.quote.ko);
      let extra = '';
      if(n.state===ST.QUEUE && n.qFac) extra = ' ('+T('대기 '+Math.round(n.queueT)+'분','waiting '+Math.round(n.queueT)+'m')+')';
      if(n.needs.restroom > 0.9) extra = ' ('+T('화장실이 급함','needs a restroom')+')';
      else if(n.heat > 0.8) extra = ' ('+T('더위에 지침','overheating')+')';
      this.say(n.name+' · '+(LANG==='ko'?n.arch.ko:n.arch.en), q+extra);
      n.sat = Math.min(100, n.sat + 1.5);
    } else if(this.targetKind==='fac'){
      const f = this.target;
      if(f.def.minigame){ MINI.start(f.def.minigame, f); return; }
      BUILD.selected = f;
      const wait = f.waitN?Math.round(f.waitSum/f.waitN):0;
      this.say(f.def.g+' '+facName(f.def),
        T('이용 '+f.uses+'회 · 매출 '+fmtInt(f.revenue)+' · 평균 대기 '+wait+'분',
          'Used '+f.uses+'× · revenue '+fmtInt(f.revenue)+' · avg wait '+wait+'m'));
      UI.refreshInspector();
    } else if(this.targetKind==='event'){
      const ev = this.target;
      const r = assignToEvent(ev);
      if(r.ok){ this.say(T('현장 지시','Field order'), T('스태프를 배치했습니다.','Staff dispatched.')); UI.refreshEvents(); }
      else { AUDIO.sfx('error'); this.say(T('불가','Unavailable'), r.reason==='NO_STAFF'?T('가용 스태프가 없습니다.','No staff available.'):reasonText(r.reason)); }
    }
  },
  say(who, text){
    const s = $('#gsubtitle');
    s.innerHTML = '<span class="who">'+who+'</span>'+text;
    s.classList.add('on');
    this.subT = 4.2;
  },
  togglePhoto(){
    this.photo = !this.photo;
    $('#photoframe').classList.toggle('on', this.photo);
    AUDIO.sfx(this.photo?'whoosh':'click');
    if(this.photo){ this.photoT = 0; FX.pushToast('📸 '+T('포토 모드 — 클릭해서 촬영','Photo mode — click to shoot'),'info'); }
  },
  shoot(){
    if(!this.photo) return;
    W.photosTaken++;
    AUDIO.sfx('point');
    FX.flash(0.85, [1,1,1]);
    const gain = Math.min(2.5, 0.6 + W.npcs.length*0.004);
    W.buzzEvent(gain, 'PHOTO');
    FX.pushToast('📸 '+T('촬영 완료','Shot captured')+' — Buzz +'+gain.toFixed(1),'ok');
  }
};

    else if(s.arrow==='right'){ x = r.left-cr.width-14; y = r.top+10; }
    else if(s.arrow==='bottom'){ x = r.left + r.width/2 - cr.width/2; y = r.top-cr.height-14; }
    else { x = r.left; y = r.bottom+14; }
    c.style.left = clamp(x, 10, innerWidth-cr.width-10)+'px';
    c.style.top = clamp(y, 10, innerHeight-cr.height-10)+'px';
    AUDIO.sfx('hover');
  },
  hide(){
    $('#coach').classList.remove('on');
    if(this._anchor) this._anchor.classList.remove('coachlight');
    this._anchor = null;
  },
  trigger(what){
    if(!SETTINGS.tutorial) return;
    if(what==='setup'){ setTimeout(()=>this.show(0), 900); }
    if(what==='live'){ setTimeout(()=>this.show(3), 2600); setTimeout(()=>this.show(4), 22000); }
  },
  notify(what, arg){
    if(!SETTINGS.tutorial) return;
    if(what==='placed'){
      this._placed = (this._placed||0)+1;
      if(this._placed===2) setTimeout(()=>this.show(1), 500);
      if(this._placed===5) setTimeout(()=>this.show(2), 500);
    }
  }
};

function saveGame(){
  try{
    const s = {
      v:2, seed:W.seed, stage:W.stage, day:W.day, gold:W.gold, gems:W.gems, staff:W.staff,
      ticket:W.ticket, promo:W.promo, cleanTier:W.cleanTier,
      metrics:W.metrics, dayStats:W.dayStats, revenueTotal:W.revenueTotal,
      visitorsTotal:W.visitorsTotal, eventScore:W.eventScore,
      eventsHandled:W.eventsHandled, eventsFailed:W.eventsFailed,
      minigameBest:W.minigameBest, minigamePlayed:W.minigamePlayed,
      facilities: W.facilities.filter(f=>!f.def.fixed).map(f=>({
        d:f.defId, c:f.c0, r:f.r0, t:f.rot,
        p:(f.programs||[]).map(p=>p?{id:p.prog.id,s:p.slot}:null)
      })),
      ts: Date.now()
    };
    localStorage.setItem('ff_save', JSON.stringify(s));
    return true;
  }catch(e){ console.warn('save failed', e); return false; }
}
function hasSave(){ try{ return !!localStorage.getItem('ff_save'); }catch(e){ return false; } }
function loadGame(){
  try{
    const s = JSON.parse(localStorage.getItem('ff_save'));
    if(!s || s.v !== 2) return false;
    W.reset(s.seed);
    W.day = s.day; W.gold = s.gold; W.gems = s.gems||0; W.staff = s.staff;
    W.ticket = s.ticket; W.promo = s.promo; W.cleanTier = s.cleanTier;
    W.metrics = s.metrics; W.dayStats = s.dayStats||[];
    W.revenueTotal = s.revenueTotal||0; W.visitorsTotal = s.visitorsTotal||0;
    W.eventScore = s.eventScore===undefined?100:s.eventScore;
    W.eventsHandled = s.eventsHandled||0; W.eventsFailed = s.eventsFailed||0;
    W.minigameBest = s.minigameBest||0; W.minigamePlayed = s.minigamePlayed||{};
    for(const f of s.facilities){
      const res = placeFacility(f.d, f.c, f.r, f.t, true);
      if(res.ok && f.p){
        f.p.forEach((pp,i)=>{
          if(!pp) return;
          const prog = PROGRAMS.find(x=>x.id===pp.id);
          if(prog){ res.f.programs[i] = { prog, slot:pp.s, done:false, participants:0, revenue:0 }; }
        });
        recalcProgramBonus(res.f);
      }
    }
    NAV.rebuildStatic();
    /* saves are taken at day boundaries → resume at the next day's morning check */
    if(s.day >= 3 && s.stage === 'report'){ setStage('finalebuy'); UI.rebuild(); UI.openFinaleBuy(); }
    else { W.day = Math.min(3, s.day + (s.stage==='report'?1:0)); beginDay(); }
    return true;
  }catch(e){ console.warn('load failed', e); return false; }
}
function saveBest(R){
  try{
    const prev = loadBest();
    if(!prev || R.score > prev.score)
      localStorage.setItem('ff_best', JSON.stringify({ score:R.score, grade:R.grade, gems:R.gems, ts:Date.now() }));
    const totalGems = (JSON.parse(localStorage.getItem('ff_meta')||'{}').gems||0) + R.gems;
    localStorage.setItem('ff_meta', JSON.stringify({ gems: totalGems }));
    localStorage.removeItem('ff_save');
  }catch(e){}
}

function metaGems(){ try{ return (JSON.parse(localStorage.getItem('ff_meta')||'{}').gems)||0; }catch(e){ return 0; } }

const GLOBE_R = 10;
const GLOBE_PINS = () => FESTIVALS.filter(f => f.globe !== false);
const ll2v = (lat,lon,r)=>{
  const a = lat*DEG, b = lon*DEG, ca = Math.cos(a);
  return [ r*ca*Math.sin(b), r*Math.sin(a), r*ca*Math.cos(b) ];
};
function buildGlobeMeshes(){
  /* ocean */
  { const b = mb();
    b.C('#7fc9e8', MAT.TINT).sphere(GLOBE_R, 64, 40);
    RD.addMesh('globe_sea', b.build('globe_sea'));
  }
  /* land tiles, raised slightly off the ocean shell */
  { const b = mb();
    const R = GLOBE_R*1.006, S = GLOBE_STEP;
    for(const [lat, ranges] of GLOBE_LAND){
      for(const [l0,l1] of ranges){
        for(let lon=l0; lon<l1; lon+=S){
          const lo2 = Math.min(lon+S, l1);
          const la0 = lat-S/2, la1 = lat+S/2;
          /* polar caps and hot deserts get their own tint */
          const abs = Math.abs(lat);
          let col = '#a9dd9a';
          if(abs > 62) col = '#f2f7fb';
          else if(abs > 52) col = '#cfe6c4';
          else if(abs < 32 && abs > 12) col = '#e8dcae';
          else if(abs <= 12) col = '#8ecf8a';
          b.C(col, MAT.FIXED);
          const p00=ll2v(la0,lon,R), p10=ll2v(la0,lo2,R), p11=ll2v(la1,lo2,R), p01=ll2v(la1,lon,R);
          const nrm = ll2v(lat,(lon+lo2)/2,1);
          const i0=b.vert(p00[0],p00[1],p00[2], nrm[0],nrm[1],nrm[2], 0,0);
          const i1=b.vert(p10[0],p10[1],p10[2], nrm[0],nrm[1],nrm[2], 1,0);
          const i2=b.vert(p11[0],p11[1],p11[2], nrm[0],nrm[1],nrm[2], 1,1);
          const i3=b.vert(p01[0],p01[1],p01[2], nrm[0],nrm[1],nrm[2], 0,1);
          b.quad(i0,i1,i2,i3);
        }
      }
    }
    RD.addMesh('globe_land', b.build('globe_land'));
  }
  /* latitude / longitude wires */
  { const b = mb();
    b.C('#ffffff', MAT.EMIT);
    const R = GLOBE_R*1.012, t = 0.012*GLOBE_R;
    for(const lat of [-60,-30,0,30,60]){
      const seg=72, rr=R*Math.cos(lat*DEG), y=R*Math.sin(lat*DEG);
      const base=b.vcount;
      for(let i=0;i<=seg;i++){ const a=i/seg*TAU;
        b.vert(Math.cos(a)*rr, y+t, Math.sin(a)*rr, 0,1,0, i/seg,0);
        b.vert(Math.cos(a)*rr, y-t, Math.sin(a)*rr, 0,1,0, i/seg,1); }
      for(let i=0;i<seg;i++){ const a=base+i*2; b.i.push(a,a+2,a+3, a,a+3,a+1); b.i.push(a,a+3,a+2, a,a+1,a+3); }
    }
    RD.addMesh('globe_grid', b.build('globe_grid'));
  }
  /* location marker: teardrop pin */
  { const b = mb();
    b.C('#ffffff', MAT.TINT);
    b.push().T(0,0.92,0).S(1,1.05,1).sphere(0.42,12,9).pop();
    b.push().T(0,0.06,0).cyl(0.03,0.30,0.82,9).pop();
    b.C('#ffffff', MAT.FIXED).push().T(0,0.96,0).S(1,1,1).sphere(0.17,10,7).pop();
    RD.addMesh('globe_pin', b.build('globe_pin'));
  }
  /* halo ring drawn under an active pin */
  { const b = mb();
    b.C('#ffffff', MAT.EMIT).RX(PI/2).torus(0.62,0.055,20,7);
    RD.addMesh('globe_ring', b.build('globe_ring'));
  }
}

const GLOBE = {
  active:false, spin:0, tilt:0.34, dist:26, targetDist:26,
  hover:null, picked:null, zoom:0, zooming:false, onPick:null,
  labels:[], labelRoot:null, dragging:false, lastX:0, vel:0.055,
  start(onPick){
    this.active = true; this.onPick = onPick;
    this.baseSpin = -(FESTIVALS[0].lon*DEG);   /* Busan dead centre */
    this.spin = this.baseSpin; this.swayT = 0; this.free = false;
    this.tilt = 0.30; this.dist = 46; this.targetDist = 25.5;
    this.zoom = 0; this.zooming = false; this.picked = null;
    if(!this.labelRoot){
      this.labelRoot = el('div',{style:{position:'fixed',inset:'0',zIndex:'205',pointerEvents:'none'}});
      document.body.appendChild(this.labelRoot);
    }
    this.labelRoot.style.display = 'block';
    this.buildLabels();
    this.attach();
    if(!document.getElementById('globehint')){
      document.body.appendChild(el('div',{id:'globehint',html:
        '<span>🖱 '+T('드래그로 지구본 회전','Drag to spin')+'</span>'
       +'<span>🔍 '+T('휠로 확대','Wheel to zoom')+'</span>'
       +'<span>📍 '+T('핀을 클릭해 축제 선택','Click a pin to choose')+'</span>'}));
    }
  },
  stop(){
    if(!this.active) return;
    this.active = false;
    if(CAM.mode === 'globe') CAM.mode = 'overview';
    if(this.labelRoot) this.labelRoot.style.display = 'none';
    this.detach();
    const h = document.getElementById('globehint'); if(h) h.remove();
  },
  attach(){
    if(this._on) return;
    this._on = {
      down: e=>{ if(e.button!==0) return; this.dragging=true; this.lastX=e.clientX; this.lastY=e.clientY; this.moved=0; },
      move: e=>{
        if(!this.dragging || this.zooming) return;
        const dx=e.clientX-this.lastX, dy=e.clientY-this.lastY;
        this.moved += Math.abs(dx)+Math.abs(dy);
        this.free = true;
        this.spin -= dx*0.0055;
        this.tilt = clamp(this.tilt + dy*0.0042, -1.15, 1.15);
        this.lastX=e.clientX; this.lastY=e.clientY;
      },
      up: e=>{
        if(this.dragging && this.moved < 5) this.clickAt(e.clientX, e.clientY);
        this.dragging=false;
      },
      wheel: e=>{ if(this.zooming) return;
        this.targetDist = clamp(this.targetDist*(1+Math.sign(e.deltaY)*0.11), 15, 42); e.preventDefault(); }
    };
    CV.addEventListener('mousedown', this._on.down);
    addEventListener('mousemove', this._on.move);
    addEventListener('mouseup', this._on.up);
    CV.addEventListener('wheel', this._on.wheel, {passive:false});
  },
  detach(){
    if(!this._on) return;
    CV.removeEventListener('mousedown', this._on.down);
    removeEventListener('mousemove', this._on.move);
    removeEventListener('mouseup', this._on.up);
    CV.removeEventListener('wheel', this._on.wheel);
    this._on = null; this.dragging = false;
  },
  /* click the 3-D pin itself, not just its label */
  clickAt(sx, sy){
    let best=null, bestD=44*44;
    for(const f of GLOBE_PINS()){
      const p = this.posOf(f.lat, f.lon, GLOBE_R*1.004);
      if(p[0]*CAM.eye[0] + p[1]*CAM.eye[1] + p[2]*CAM.eye[2] <= GLOBE_R*GLOBE_R*0.14) continue;
      const q = CAM.projectToScreen(p[0], p[1]+0.9, p[2]);
      if(!q) continue;
      const d = (q.x-sx)*(q.x-sx) + (q.y-sy)*(q.y-sy);
      if(d < bestD){ bestD=d; best=f; }
    }
    if(best) this.pick(best);
  },
  buildLabels(){
    this.labelRoot.innerHTML = '';
    this.labels = GLOBE_PINS().map(f=>{
      const n = el('button',{class:'globe-label'+(f.open?' open':' locked'),
        style:{position:'absolute',pointerEvents:'auto'},
        onclick:()=>this.pick(f)});
      n.innerHTML = '<i></i><b>'+(LANG==='ko'?f.ko:f.en)+'</b>'
        + (f.open ? '<span class="go">▶ '+T('플레이 가능','Playable')+'</span>'
                  : '<span class="lk">🔒 '+T('준비 중','Coming soon')+'</span>');
      this.labelRoot.appendChild(n);
      return { f, n };
    });
  },
  pick(f){
    if(this.zooming) return;
    if(!f.open){
      AUDIO.sfx('error');
      FX.pushToast('🔒 '+(LANG==='ko'?f.ko:f.en)+' — '+T('준비 중입니다','Coming soon'),'warn');
      return;
    }
    AUDIO.sfx('open');
    this.picked = f; this.zooming = true;
  },
  update(dt){
    if(!this.active) return;
    if(this.zooming){
      this.zoom = Math.min(1, this.zoom + dt*0.62);
      const f = this.picked;
      /* swing the target longitude to face camera while diving in */
      const want = -(f.lon*DEG) - 0.0;
      this.spin = angLerp(this.spin, want, 1-Math.exp(-3.4*dt));
      this.tilt = damp(this.tilt, f.lat*DEG*0.85, 3.4, dt);
      this.targetDist = lerp(25.5, 10.9, smootherstep(0,1,this.zoom));
      if(this.zoom >= 1 && this.onPick){ const cb=this.onPick; this.onPick=null; cb(this.picked); }
    } else if(!this.dragging){
      if(this.free) this.spin += dt*this.vel;
      else { this.swayT += dt; this.spin = this.baseSpin + Math.sin(this.swayT*0.17)*0.52; }
    }
    this.dist = damp(this.dist, this.targetDist, 3.2, dt);
    /* camera sits on +Z looking at the origin; the globe spins under it */
    const ox = (innerWidth > 860) ? -GLOBE_R*0.40*(1-this.zoom) : 0;
    CAM.eye[0] = ox; CAM.eye[1] = Math.sin(this.tilt)*this.dist; CAM.eye[2] = Math.cos(this.tilt)*this.dist;
    CAM.tgt[0] = ox; CAM.tgt[1] = 0; CAM.tgt[2] = 0;
    CAM.fov = 42;
  },
  /* world position of a lat/lon after the current spin */
  posOf(lat,lon,r){
    const p = ll2v(lat, lon, r===undefined?GLOBE_R:r);
    const c = Math.cos(this.spin), s = Math.sin(this.spin);
    return [ p[0]*c + p[2]*s, p[1], -p[0]*s + p[2]*c ];
  },
  draw(dt){
    if(!this.active) return;
    M4.trsY(TMP, 0,0,0, this.spin, 1,1,1);
    RD.mNC('globe_sea', TMP, 0.50,0.79,0.91, 0.06, 0.85, 1, 0, 0);
    RD.mNC('globe_land', TMP, 1,1,1, 0, 0.6, 1, 0, 0);
    RD.mNC('globe_grid', TMP, 0.62,0.82,1.0, 0.30, 0.5, 1, 0, 0);
    for(const f of GLOBE_PINS()){
      const up = ll2v(f.lat, f.lon, 1);
      const p  = this.posOf(f.lat, f.lon, GLOBE_R*1.004);
      /* orient the pin along the surface normal */
      const n  = this.posOf(f.lat, f.lon, 1);
      const yaw = Math.atan2(n[0], n[2]);
      const pitch = Math.asin(clamp(n[1],-1,1));
      const s = f.open ? 1.15 : 0.85;
      M4.trs(TMP2, p[0],p[1],p[2], -(pitch-PI/2)-PI/2, yaw, 0, s,s,s);
      const col = f.open ? [1.0,0.42,0.36] : [0.62,0.68,0.76];
      const em  = f.open ? (1.6 + Math.sin(RD.time*3.4)*0.7) : 0.12;
      RD.mNC('globe_pin', TMP2, col[0],col[1],col[2], em, 0.5,1,0, 0);
      if(f.open){
        const pulse = 1 + (RD.time*0.8 % 1)*1.5;
        M4.trs(TMP2, p[0],p[1],p[2], -(pitch-PI/2)-PI/2, yaw, 0, pulse,pulse,pulse);
        RD.mNC('globe_ring', TMP2, 1.0,0.5,0.4, 1.8*(1-(RD.time*0.8 % 1)), 0.5,1,0, 0);
        if(Math.random() < dt*8) FX.sparkle(p[0],p[1],p[2],'#ff8f6b',1);
      }
    }
    this.updateLabels();
  },
  updateLabels(){
    const fade = 1-this.zoom;
    for(const {f,n} of this.labels){
      const p = this.posOf(f.lat, f.lon, GLOBE_R*1.004);
      const sp = CAM.projectToScreen(p[0], p[1]+1.5, p[2]);
      /* hide labels on the far side of the globe */
      const facing = (p[2]*CAM.eye[2] + p[1]*CAM.eye[1] + p[0]*CAM.eye[0]) > GLOBE_R*GLOBE_R*0.14;
      if(!sp || !facing || fade < 0.25){ n.style.display='none'; continue; }
      n.style.display = 'block';
      n.style.left = sp.x+'px';
      n.style.top  = sp.y+'px';
      n.style.opacity = fade;
    }
  }
};

Bus.on('key', (k, e)=>{
  if(UI.typing) return;
  if(k === 'Escape'){
    if(MINI.active){ MINI.quit(); return; }
    if(FINALE.active){ FINALE.skip(); return; }
    if($('#coach').classList.contains('on')){ Tutorial.hide(); return; }
    if(UI.modalOpen){
      const o = UI._modalOpts;
      if(o && o.closable !== false) UI.closeModal();
      return;
    }
    if(BUILD.mode){ BUILD.cancel(); return; }
    if(GROUND.photo){ GROUND.togglePhoto(); return; }
    if(IN.locked){ IN.unlock(); return; }
    if(W.stage!=='title') UI.openSettings();
    return;
  }
  if($('#title')) return;
  if(MINI.active || FINALE.active) return;
  if(UI.modalOpen) return;
  switch(k){
    case 'Tab':
      e.preventDefault();
      if(W.stage!=='title') CAM.setMode(CAM.mode==='ground'?'overview':'ground');
      break;
    case ' ':
      if(W.stage==='live') UI.setSpeed(W.paused?1:0), UI.buildDock();
      break;
    case 'r': BUILD.rotate(1); break;
    case 'x': if(BUILD.canBuild()) BUILD.setMode('__remove'); break;
    case 'l': toggleLang(); break;
    case 'h': UI.openHelp(); break;
    case 'f': if(CAM.mode==='ground') GROUND.togglePhoto(); break;
    case 'e': if(CAM.mode==='ground') GROUND.interact(); break;
    case 'p': UI.legendOn = !UI.legendOn; UI.refreshLegend(); UI.buildDock(); break;
    case 'g': if(W.stage==='live') UI.openMinigamePicker(); break;
    case '1': if(W.stage==='live'){ UI.setSpeed(1); UI.buildDock(); } break;
    case '2': if(W.stage==='live'){ UI.setSpeed(2); UI.buildDock(); } break;
    case '3': if(W.stage==='live'){ UI.setSpeed(4); UI.buildDock(); } break;
    case 'c':
      UI.heatLayer = UI.heatLayer >= 3 ? -1 : UI.heatLayer + 1;
      RD.heatMode = UI.heatLayer;
      UI.buildDock(); UI.refreshLegend();
      break;
    case '0': UI.heatLayer = -1; RD.heatMode = -1; UI.buildDock(); UI.refreshLegend(); break;
  }
});

function onShowStart(){
  W.showActive = true;
  W.showAudience = 0;
  if(W.speed > 1){ W.speed = 1; UI.refreshSpeed(); }
  FX.bigMsg(T('메인 공연','MAIN SHOW'), '19:40 – 20:30');
  FX.pushToast('🎤 '+T('메인 공연 시작 — 배속이 x1로 고정됩니다','Main show — speed locked to x1'),'gold', 4200);
  W.buzzEvent(9,'SHOW');
  AUDIO.setScene('finale');
  AUDIO.sfx('cheer');
  const S = W.mainStage;
  for(let i=0;i<6;i++) setTimeout(()=>FX.burst(S.x+8, S.z+(i-3)*3, '#ffd166', 18, 8), i*160);
  /* pull the crowd toward the stage right now — the show is a 50-minute window,
     waiting for each NPC's next decision tick would leave the field half empty */
  for(const n of W.npcs){
    if(n.state === ST.USE || n.watchedShow) continue;
    const pull = 0.42 + n.arch.pref.fun*0.26 + (n.arch.id==='youth'?0.24:0)
               + (n.state===ST.QUEUE ? -0.30 : 0);
    if(!W.rng.chance(clamp01(pull))) continue;
    if(n.qFac) leaveQueue(n, false);
    const sp = showSpot(n);
    n.target = W.mainStage; n.targetKind = 'show'; n.reason = 'SHOW';
    n.watchX = sp.x; n.watchZ = sp.z;
    n.state = ST.TRAVEL; n.stateT = 0;
    requestPath(n, sp.x, sp.z);
  }
}
function onShowEnd(){
  W.showActive = false; W.showDone = true;
  FX.bigMsg(T('공연 종료','SHOW ENDS'), T('퇴장 동선을 주시하세요','Watch the exit flow'));
  FX.pushToast('🚶 '+T('공연 종료 — 대규모 이동이 시작됩니다','Show over — mass movement begins'),'warn', 4200);
  AUDIO.setScene('night');
  AUDIO.sfx('cheer');
  /* everyone re-decides at once: the classic bottleneck (AT-002) */
  for(const n of W.npcs){
    if(n.state === ST.WATCH){ n.state = ST.SELECT; n.stateT = 0; }
  }
}
let heatTimer = 0, navTimer = 0, ambTimer = 0;
function updateSim(sdt){
  W.clock += sdt;
  if(W.clock >= W.dayEnd){
    W.clock = W.dayEnd;
    updateNPCs(Math.min(sdt,0.05));
    endDay();
    return;
  }
  const ts = W.slotOf(W.clock);
  if(ts > W.slot) advanceSlot();
  const inShow = W.clock >= 1180 && W.clock < 1230;
  if(inShow && !W.showActive && !W.showDone) onShowStart();
  if(!inShow && W.showActive) onShowEnd();
  if(W.isShowWindow() && W.speed > 1){ W.speed = 1; UI.refreshSpeed(); }
  /* scheduled incidents */
  W.slotElapsed = (W.slotElapsed||0) + sdt;
  while(W.slotEventTimes && W.slotEventTimes.length && W.slotElapsed >= W.slotEventTimes[0].at){
    spawnEvent(W.slotEventTimes.shift().id);
    UI.refreshEvents();
  }
  updateArrivals(sdt);
  updateNPCs(sdt);
  updateStaff(sdt);
  updateEvents(sdt);
  HEAT.decay(sdt);
  /* litter accumulates around food/retail */
  for(const f of W.facilities){
    if(f.def.dirties || f.def.cat==='food') HEAT.addLitter(f.x, f.z, sdt*0.0012*(f.queue.length+1));
  }
  /* recycling bins clean their radius */
  for(const f of W.facilities){
    if(!f.def.cleanRadius || !f.active) continue;
    const cw = HEAT.area[2]/HEAT_W, ch = HEAT.area[3]/HEAT_H;
    const cx = Math.floor((f.x-HEAT.area[0])/cw), cz = Math.floor((f.z-HEAT.area[1])/ch);
    const rr = Math.ceil(f.def.cleanRadius/Math.min(cw,ch));
    for(let dz=-rr;dz<=rr;dz+=2) for(let dx=-rr;dx<=rr;dx+=2){
      const X=cx+dx, Z=cz+dz;
      if(X<0||Z<0||X>=HEAT_W||Z>=HEAT_H) continue;
      if(Math.hypot(dx*cw, dz*ch) > f.def.cleanRadius) continue;
      const i = Z*HEAT_W+X;
      HEAT.litter[i] = Math.max(0, HEAT.litter[i] - sdt*0.010);
    }
  }
  /* buzz decays toward a baseline so a good day cannot snowball forever */
  W.metrics.buzz = damp(W.metrics.buzz, 24, 0.0013, sdt);
  /* --- crowd-density safety pressure: measured once over the whole field,
         never per-NPC (that scaled with population and flattened safety) --- */
  let overSum = 0;
  for(let i=0;i<HEAT.crowd.length;i++){
    const c = HEAT.crowd[i];
    if(c > 6.0) overSum += Math.min(4, c-6.0);
  }
  if(overSum > 0) W.safetyEvent(-sdt*Math.min(1.4, overSum*0.012), 'CROWD_DENSITY');
  /* night darkness pressure */
  if(W.clock > 1140){
    let unlit = 0;
    for(const n of W.npcs) if(lightQuality(n.x,n.z) < 0.15) unlit++;
    if(W.npcs.length && unlit/W.npcs.length > 0.55) W.safetyEvent(-sdt*0.16, 'NIGHT_DARK');
  }
  /* safety recovers slowly when nothing is wrong */
  const unattended = W.events.filter(e=>!e.done && !e.def.good && e.assigned < e.def.staff).length;
  if(!unattended && overSum <= 0) W.safetyEvent(sdt*0.30, 'SAFETY_INFRA');
  let infra = 0;
  for(const f of W.facilities) if(f.def.safety && f.active) infra += f.def.safety;
  W.metrics.safety = clamp(W.metrics.safety, 0, Math.min(100, 76 + infra));
  /* cleanliness from total litter mass across the grounds */
  let lit = 0;
  for(let i=0;i<HEAT.litter.length;i++) lit += HEAT.litter[i];
  W.metrics.clean = damp(W.metrics.clean, clamp(100 - lit*0.30, 0, 100), 0.35, sdt);
}
function tickSlow(dt){
  navTimer += dt;
  if(navTimer > 0.5){ navTimer = 0; HEAT.toNav(); for(let i=0;i<NAV.danger.length;i++) NAV.danger[i] *= 0.7; }
  heatTimer += dt;
  if(heatTimer > 0.12){ heatTimer = 0; if(RD.heatMode >= 0) HEAT.upload(); }
  ambTimer += dt;
  if(ambTimer > 1.0){
    ambTimer = 0;
    AUDIO.setCrowd(clamp01(W.npcs.length/230));
    if(W.stage==='live' && !MINI.active && !FINALE.active){
      const want = W.showActive ? 'finale' : (W.clock > 1140 ? 'night' : 'live');
      AUDIO.setScene(want);
    }
  }
}

/* ===========================================================================
   42. MAIN LOOP
   =========================================================================== */
let lastT = 0, fpsAcc = 0, fpsN = 0, fps = 60, fpsEl = null;
function frame(now){
  requestAnimationFrame(frame);
  if(!lastT) lastT = now;
  let dt = (now - lastT)/1000;
  lastT = now;
  if(dt > 0.25) dt = 0.25;
  fpsAcc += dt; fpsN++;
  if(fpsAcc > 0.5){ fps = fpsN/fpsAcc; fpsAcc = 0; fpsN = 0; updateFpsHUD(); }

  /* ---- simulation ---- */
  if(MINI.active) MINI.update(dt);
  if(FINALE.active) FINALE.update(dt);
  if(W.stage === 'live' && !W.paused && !UI.modalOpen && !FINALE.active){
    let sdt = dt * W.speed;
    const MAXSTEP = 0.05;
    let guard = 0;
    while(sdt > 1e-4 && guard++ < 12 && W.stage === 'live'){
      const s = Math.min(sdt, MAXSTEP);
      updateSim(s);
      sdt -= s;
    }
  } else if(W.stage === 'title'){
    GLOBE.update(dt);
  } else if(FINALE.active){
    updateNPCs(Math.min(dt, 0.05));
  }
  tickSlow(dt);

  /* ---- atmosphere ---- */
  ATMO.update(W.stage==='title' ? 0.4 : (W.stage==='finale' ? 22.0 : W.clock/60));
  if(GLOBE.active){ ATMO.dir[0]=0.46; ATMO.dir[1]=0.36; ATMO.dir[2]=0.81;
    ATMO.sunCol=[1.35,1.30,1.18]; ATMO.fogDen=0.0; }

  /* ---- camera & interaction ---- */
  if(CAM.mode === 'globe'){ /* GLOBE.update already drove the camera */ }
  else if(!MINI.active || CAM.mode === 'cine') CAM.update(dt);
  if(!MINI.active && !FINALE.active && W.stage !== 'title'){
    BUILD.update();
    GROUND.update(dt);
  }
  if(CAM.mode==='ground' && IN.clicked[0] && !UI.modalOpen){
    if(!IN.locked) IN.lock();
    else if(GROUND.photo) GROUND.shoot();
    else GROUND.interact();
  }
  FX.update(dt);

  /* ---- render ---- */
  CAM.apply();
  RD.begin(dt);
  RD.heatArea = HEAT.area;
  if(GLOBE.active){
    GLOBE.draw(dt);
  } else if(MINI.active){
    /* the ocean course renders bare water; the festival-set games keep the
       actual grounds behind them so the venue is still visible */
    if(MINI.game && MINI.game.scene === 'festival') SCENE.draw(dt);
    else { M4.trsY(TMP, 0,0,0, 0, 1,1,1); RD.mNC('terrain', TMP, 1,1,1, 0, 0.9,1,0,0); }
    MINI.draw(dt);
  } else {
    SCENE.draw(dt);
  }
  FX.draw();
  RD.flash = damp(RD.flash, 0, 5.5, dt);
  RD.render({
    noWater: GLOBE.active,
    exposure: GLOBE.active ? 1.30 : (MINI.active ? 1.08 : undefined),
    bloomMul: FINALE.active ? 1.5 : 1,
    sat: FINALE.active ? 1.24 : 1.16
  });

  /* ---- UI ---- */
  UI.tick(dt);
  IN.endFrame();
}
function updateFpsHUD(){
  if(!SETTINGS.showFps){ if(fpsEl){ fpsEl.remove(); fpsEl=null; } return; }
  if(!fpsEl){
    fpsEl = el('div',{style:{position:'fixed',right:'8px',top:'8px',zIndex:'200',padding:'5px 9px',
      borderRadius:'8px',background:'rgba(0,0,0,.72)',font:'700 11px var(--mono)',color:'#8fe',
      pointerEvents:'none',whiteSpace:'pre',lineHeight:'1.5'}});
    document.body.appendChild(fpsEl);
  }
  fpsEl.textContent =
    fps.toFixed(0)+' fps\n'+
    'npc '+W.npcs.length+'\n'+
    'draw '+RSTAT.dc+'\n'+
    'inst '+RSTAT.inst+'\n'+
    'tri '+Math.round(RSTAT.tri/1000)+'k\n'+
    'part '+FX.parts.length;
}

    BOOT.set(0.10, 'WebGL2 · shaders');
    RD.init();

    buildAllMeshes((p,s)=>BOOT.set(0.22 + p*0.5, s));
    BOOT.set(0.76, 'scenery');
    SCENE.build();
    BOOT.set(0.82, 'systems');
    FX.init();
    IN.init();
    CAM.init();
    W.reset(20260801);
    RD.heatArea = HEAT.area;
    BOOT.set(0.90, 'interface');
    UI.init();
    addEventListener('resize', ()=>{ RD.resize(); UI.rebuild(); });
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden && SETTINGS.autoPause && W.stage==='live' && !W.paused){
        W.paused = true; W.speed = 0; UI.refreshSpeed(); UI.buildDock();

    });
    /* start audio on the first gesture */
    const kick = ()=>{ AUDIO.init(); AUDIO.resume(); removeEventListener('pointerdown', kick); removeEventListener('keydown', kick); };
    addEventListener('pointerdown', kick); addEventListener('keydown', kick);
    BOOT.set(1.0, 'ready');
    window.__booted = true;
    showTitle();
    requestAnimationFrame(frame);
    setTimeout(()=>BOOT.done(), 260);
    /* expose a tiny debug surface */
    window.FF = { W, RD, CAM, UI, BUILD, MINI, FINALE, AUDIO, NAV, HEAT, BAL, SETTINGS,
      grade:()=>computeFinal(), gold:(n)=>{ W.gold += n; UI.buildTopbar(); } };
  }catch(e){
    console.error(e);
    BOOT.fail(e);
  }
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
//<<<APPEND>>>
</script>
</body>
