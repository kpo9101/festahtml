const STAGE_INFO = {
  setup:     { ko:'셋업',       en:'Setup' },
  promotion: { ko:'홍보',       en:'Promotion' },
  morning:   { ko:'개장 준비',   en:'Morning Check' },
  live:      { ko:'개장',       en:'Live' },
  closing:   { ko:'마감',       en:'Closing' },
  report:    { ko:'결산',       en:'Report' },
  finalebuy: { ko:'피날레 준비', en:'Finale Prep' },
  finale:    { ko:'피날레',     en:'Finale' },
  final:     { ko:'최종 결산',   en:'Final Report' },
};
const stageName = s => LANG==='ko' ? (STAGE_INFO[s]||{ko:s}).ko : (STAGE_INFO[s]||{en:s}).en;

function setStage(s){
  W.stage = s;
  Bus.emit('stage', s);
  UI.rebuild();
}
function beginDay(){
  W.slot = 0; W.clock = 600;
  W.visitorsToday = 0; W.revenueToday = 0; W.expenseToday = 0;
  W.dayLedger = [];
  W.showDone = false; W.showActive = false; W.showAudience = 0;
  METRIC_CAUSE.reset();
  W.satSamples = []; W.satAccum = W.metrics.sat;
  /* weather roll */
  const R = W.rng;
  const wpool = W.day===2 ? ['hot','hot','clear','breeze'] : (W.day===3 ? ['clear','breeze','clear','hot'] : ['clear','clear','breeze','hot']);
  W.weather = R.pick(wpool);
  ATMO.weather = W.weather;
  /* cleanliness carries over */
  const tier = BAL.cleanTiers[W.cleanTier];
  W.metrics.clean = clamp(tier.clean, 0, 100);
  if(tier.satNext) W.satEvent(tier.satNext, 'CLEANUP');
  /* reset program 'done' for the new day */
  for(const f of W.facilities){ for(const p of (f.programs||[])) if(p) { p.done=false; p.participants=0; p.revenue=0; } recalcProgramBonus(f); }
  for(const f of W.facilities){ f.uses=0; f.revenue=0; f.abandons=0; f.waitSum=0; f.waitN=0; f.active=true; f.disabledUntil=0; }
  HEAT.clear();
  NAV.danger.fill(0);
  setStage('morning');
  UI.openMorningCheck();
}
function openGates(){
  setStage('live');
  W.slot = 0; W.clock = 600;
  W.slotTargetArrivals = slotArrivalTarget();
  W.spawnedThisSlot = 0; W.arrivalAccum = 0;
  scheduleSlotEvents();
  HEAT.buildAttraction();
  AUDIO.setScene('live');
  FX.bigMsg(T('개장!','GATES OPEN'), T('DAY '+W.day+' · '+(LANG==='ko'?'다대포 해수욕장':'Dadaepo Beach'),'DAY '+W.day+' · DADAEPO BEACH'));
  Tutorial.trigger('live');
}
function advanceSlot(){
  /* settle programs for the slot that just ended */
  for(const f of W.facilities) for(const p of (f.programs||[])){
    if(p && p.slot === W.slot && !p.done){
      p.done = true;
      W.buzzEvent(p.prog.buzz*0.5, 'PROGRAM');
      recalcProgramBonus(f);
    }
  }
  W.slot++;
  if(W.slot > 3){ endDay(); return; }
  W.slotTargetArrivals = slotArrivalTarget();
  W.spawnedThisSlot = 0; W.arrivalAccum = 0;
  scheduleSlotEvents();
  HEAT.buildAttraction();
  /* nearby-sales bonus from busking */
  for(const f of W.facilities) f.nearbyBoost = 1;
  for(const {f,p} of programsActiveNow()){
    if(p.prog.nearbySales){
      for(const g of W.facilities){
        if(g===f || !g.def.rev) continue;
        if(dist(f.x,f.z,g.x,g.z) < 20) g.nearbyBoost = p.prog.nearbySales;
      }
    }
  }
  FX.pushToast('🕐 '+T('타임 슬롯 '+(W.slot+1)+' 시작', 'Time slot '+(W.slot+1)+' begins'), 'info');
  Bus.emit('slot');
}
function endDay(){
  setStage('closing');
  W.paused = true;
  /* despawn remaining visitors gradually handled by closing modal */
  UI.openClosing();
}
function settleDay(cleanTierId){
  W.cleanTier = cleanTierId;
  const tier = BAL.cleanTiers[cleanTierId];
  W.tx(-BAL.rentPerDay, 'RENT');
  W.tx(-BAL.wagePerStaff*W.staff, 'WAGE', W.staff+'x');
  let upkeep = 0;
  for(const f of W.facilities) upkeep += f.def.upkeep||0;
  if(upkeep) W.tx(-upkeep, 'UPKEEP');
  W.tx(-tier.cost, 'CLEANUP', LANG==='ko'?tier.ko:tier.en);
  /* daily goal */
  const goal = BAL.dayGoals[clamp(W.day-1,0,2)];
  const met = W.revenueToday >= goal;
  if(met) W.tx(BAL.goalBonus, 'GOAL_BONUS');
  /* aggregate satisfaction */
  const samples = W.satSamples.concat(W.npcs.map(n=>n.sat));
  const avg = samples.length ? samples.reduce((a,b)=>a+b,0)/samples.length : W.metrics.sat;
  W.metrics.sat = clamp(lerp(W.metrics.sat, avg, 0.82), 0, 100);
  const dayStat = {
    day: W.day, visitors: W.visitorsToday,
    revenue: W.revenueToday, expense: W.expenseToday,
    net: W.revenueToday - W.expenseToday,
    sat: W.metrics.sat, safety: W.metrics.safety, clean: W.metrics.clean, buzz: W.metrics.buzz,
    goal, goalMet: met, weather: W.weather,
    events: W.events.length, handled: W.eventsHandled, failed: W.eventsFailed,
    causes: { sat: METRIC_CAUSE.top('sat',7), safety: METRIC_CAUSE.top('safety',5) },
    ledger: W.dayLedger.slice(),
    audience: W.showAudience||0,
  };
  W.dayStats.push(dayStat);
  W.revenueTotal += W.revenueToday;
  setStage('report');
  UI.openReport(dayStat);
  saveGame();
}
function nextDayOrFinale(){
  /* clear the crowd */
  for(let i=W.npcs.length-1;i>=0;i--) despawnNPC(W.npcs[i], i);
  W.events.length = 0;
  W.staffUnits.length = 0; W.staffBusy = 0;
  if(W.day >= 3){
    setStage('finalebuy');
    UI.openFinaleBuy();
  } else {
    W.day++;
    beginDay();
  }
}

/* ===========================================================================
   26. SCORING
   =========================================================================== */
function computeFinal(){
  const satAvg = W.dayStats.length ? W.dayStats.reduce((a,d)=>a+d.sat,0)/W.dayStats.length : W.metrics.sat;
  const safAvg = W.dayStats.length ? W.dayStats.reduce((a,d)=>a+d.safety,0)/W.dayStats.length : W.metrics.safety;
  const revTarget = 26000;
  const revScore = clamp01(W.revenueTotal/revTarget)*100;
  const evScore = W.eventScore;
  const finTier = BAL.finale[W.finaleTier];
  const finScore = (W.finaleTier/4)*100;
  const w = BAL.weights;
  let score = satAvg*w.sat + revScore*w.rev + safAvg*w.safety + evScore*w.event + finScore*w.finale;
  score += finTier.bonus*0.42;
  score = clamp(score, 0, 100);
  let grade = 'F';
  for(const [g,c] of BAL.gradeCuts){ if(score >= c){ grade = g; break; } }
  const gems = BAL.gemByGrade[grade] || 40;
  return { score, grade, gems, satAvg, safAvg, revScore, evScore, finScore, finTier,
           parts:[
             { k:T('만족도','Satisfaction'), v:satAvg, w:w.sat, c:'var(--sat)' },
             { k:T('수익','Revenue'), v:revScore, w:w.rev, c:'var(--rev)' },
             { k:T('안전','Safety'), v:safAvg, w:w.safety, c:'var(--saf)' },
             { k:T('사건 대응','Incidents'), v:evScore, w:w.event, c:'var(--coral)' },
             { k:T('피날레','Finale'), v:finScore, w:w.finale, c:'var(--gold)' },
           ] };
}
/* ===========================================================================
   27. AUDIO — fully synthesised, no external assets
   =========================================================================== */
const AUDIO = {
  ctx:null, ready:false, scene:'menu',
  master:null, musicG:null, sfxG:null, ambG:null,
  noiseBuf:null, waveSrc:null, crowdSrc:null, crowdFilt:null, crowdG:null,
  nextNote:0, step:0, bpm:118, timer:null, chordI:0,
  init(){
    if(this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    const c = this.ctx;
    this.master = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 22; comp.ratio.value = 5;
    comp.attack.value = 0.004; comp.release.value = 0.22;
    this.master.connect(comp); comp.connect(c.destination);
    this.musicG = c.createGain(); this.musicG.connect(this.master);
    this.sfxG   = c.createGain(); this.sfxG.connect(this.master);
    this.ambG   = c.createGain(); this.ambG.connect(this.master);
    /* reverb */
    this.verb = c.createConvolver();
    const len = c.sampleRate*1.9, ir = c.createBuffer(2, len, c.sampleRate);
    for(let ch=0;ch<2;ch++){
      const d = ir.getChannelData(ch);
      for(let i=0;i<len;i++){ d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.7); }
    }
    this.verb.buffer = ir;
    this.verbG = c.createGain(); this.verbG.gain.value = 0.26;
    this.verb.connect(this.verbG); this.verbG.connect(this.master);
    /* noise buffer */
    const nl = c.sampleRate*2;
    this.noiseBuf = c.createBuffer(1, nl, c.sampleRate);
    const nd = this.noiseBuf.getChannelData(0);
    let last = 0;
    for(let i=0;i<nl;i++){ const wnoise = Math.random()*2-1; last = (last + 0.02*wnoise)/1.02; nd[i] = last*3.2; }
    this.setVolumes();
    this.startAmbience();
    this.ready = true;
    this.nextNote = c.currentTime;
    this.timer = setInterval(()=>this.schedule(), 26);
  },
  resume(){ if(this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setVolumes(){
    if(!this.ctx) return;
    const m = SETTINGS.master;
    this.master.gain.value = m;
    this.musicG.gain.value = SETTINGS.music*0.72;
    this.sfxG.gain.value = SETTINGS.sfx*0.9;
    this.ambG.gain.value = SETTINGS.ambience*0.5;
  },
  startAmbience(){
    const c = this.ctx;
    /* sea */
    const s = c.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520; f.Q.value=0.6;
    const g = c.createGain(); g.gain.value = 0.34;
    const lfo = c.createOscillator(); lfo.frequency.value = 0.11;
    const lg = c.createGain(); lg.gain.value = 0.22;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    s.connect(f); f.connect(g); g.connect(this.ambG); s.start();
    this.waveSrc = s; this.waveG = g;
    /* crowd murmur */
    const s2 = c.createBufferSource(); s2.buffer = this.noiseBuf; s2.loop = true;
    const f2 = c.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=780; f2.Q.value=1.1;
    const f3 = c.createBiquadFilter(); f3.type='highpass'; f3.frequency.value=320;
    const g2 = c.createGain(); g2.gain.value = 0.0;
    s2.connect(f2); f2.connect(f3); f3.connect(g2); g2.connect(this.ambG); s2.start();
    this.crowdG = g2; this.crowdFilt = f2;
  },
  setCrowd(level){
    if(!this.crowdG) return;
    const t = this.ctx.currentTime;
    this.crowdG.gain.setTargetAtTime(clamp(level,0,1)*0.42, t, 1.4);
    if(this.crowdFilt) this.crowdFilt.frequency.setTargetAtTime(700+level*420, t, 1.4);
  },
  setScene(s){
    if(this.scene === s) return;
    this.scene = s;
    this.step = 0; this.chordI = 0;
    if(this.ctx) this.nextNote = Math.max(this.nextNote, this.ctx.currentTime);
  },
  /* --- one-shot voice --- */
  tone(freq, dur, type, vol, attack, detune, dest, glide){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(); o.type = type||'sine';
    o.frequency.setValueAtTime(freq, t);
    if(glide) o.frequency.exponentialRampToValueAtTime(Math.max(20,glide), t+dur);
    if(detune) o.detune.value = detune;
    const g = c.createGain();
    const a = attack===undefined?0.006:attack;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002,vol||0.2), t+a);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest||this.sfxG);
    if(dest !== this.musicG) g.connect(this.verb);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(dur, vol, hp, lp, dest){
    if(!this.ctx) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.noiseBuf;
    s.playbackRate.value = 1 + Math.random()*0.4;
    const f = c.createBiquadFilter(); f.type='bandpass';
    f.frequency.value = (hp+lp)/2; f.Q.value = 0.7;
    const g = c.createGain();
    g.gain.setValueAtTime(vol||0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); g.connect(dest||this.sfxG);
    s.start(t); s.stop(t+dur+0.02);
  },
  sfx(name){
    if(!this.ctx) return;
    switch(name){
      case 'click':   this.tone(760, 0.055, 'triangle', 0.14, 0.002); break;
      case 'hover':   this.tone(1180, 0.03, 'sine', 0.05, 0.002); break;
      case 'place':   this.tone(320, 0.12, 'square', 0.10, 0.003, 0, null, 180);
                      this.noise(0.16, 0.16, 200, 1400); break;
      case 'error':   this.tone(180, 0.19, 'sawtooth', 0.15, 0.003, 0, null, 96); break;
      case 'cash':    this.tone(880, 0.09, 'triangle', 0.16, 0.002);
                      setTimeout(()=>this.tone(1320,0.13,'triangle',0.13,0.002), 55); break;
      case 'spend':   this.tone(420, 0.10, 'triangle', 0.12, 0.002, 0, null, 300); break;
      case 'alert':   this.tone(660, 0.13, 'square', 0.13, 0.004);
                      setTimeout(()=>this.tone(520,0.20,'square',0.12,0.004), 145); break;
      case 'good':    this.tone(660, 0.09, 'sine', 0.14, 0.003);
                      setTimeout(()=>this.tone(990,0.13,'sine',0.12,0.003), 80); break;
      case 'assign':  this.tone(520, 0.07, 'triangle', 0.12, 0.002);
                      setTimeout(()=>this.tone(780,0.09,'triangle',0.10,0.002), 60); break;
      case 'resolve': [523,659,784,1046].forEach((f,i)=>setTimeout(()=>this.tone(f,0.20,'sine',0.13,0.004), i*72)); break;
      case 'open':    [392,523,659].forEach((f,i)=>setTimeout(()=>this.tone(f,0.30,'triangle',0.12,0.006), i*90)); break;
      case 'boom':    this.noise(0.55, 0.42, 40, 320);
                      this.tone(58, 0.5, 'sine', 0.34, 0.004, 0, null, 24); break;
      case 'crackle': for(let i=0;i<7;i++) setTimeout(()=>this.noise(0.05, 0.09, 1800, 7000), i*38+Math.random()*40); break;
      case 'launch':  this.noise(0.5, 0.10, 300, 2600); this.tone(180,0.5,'sine',0.06,0.01,0,null,900); break;
      case 'cheer':   this.noise(1.7, 0.30, 500, 3200); break;
      case 'whoosh':  this.noise(0.28, 0.16, 300, 3200); break;
      case 'splash':  this.noise(0.32, 0.24, 500, 5200); break;
      case 'point':   this.tone(1046, 0.09, 'sine', 0.13, 0.002);
                      setTimeout(()=>this.tone(1568,0.11,'sine',0.10,0.002), 55); break;
      case 'fail':    this.tone(220, 0.35, 'sawtooth', 0.16, 0.004, 0, null, 82); break;
      case 'count':   this.tone(880, 0.12, 'square', 0.14, 0.003); break;
      case 'grade':   [523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>this.tone(f,0.6,'triangle',0.14,0.01), i*110)); break;
    }
  },
  /* =====================================================================
     Festival score. Bright major-key groove with a steel-drum lead, a real
     melody hook, claps and shaker. Every note is synthesised on the fly;
     there is no sample data anywhere in the file.
     ===================================================================== */
  schedule(){
    if(!this.ctx || this.scene === 'off') return;
    const c = this.ctx;
    if(c.state === 'suspended') return;
    const spb = 60/this.bpm/2;   // eighth notes
    while(this.nextNote < c.currentTime + 0.28){
      this.playStep(this.nextNote);
      this.nextNote += spb;
      this.step++;
    }
  },
  /* steel-drum / marimba bell: sine carrier plus a bright inharmonic partial */
  bell(t, f, dur, vol, bright){
    const c = this.ctx;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0003, vol), t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    const o1 = c.createOscillator(); o1.type='sine'; o1.frequency.value=f;
    const o2 = c.createOscillator(); o2.type='sine'; o2.frequency.value=f*3.01;
    const g2 = c.createGain(); g2.gain.value = (bright===undefined?0.34:bright);
    const o3 = c.createOscillator(); o3.type='triangle'; o3.frequency.value=f*2;
    const g3 = c.createGain(); g3.gain.value = 0.20;
    o1.connect(g); o2.connect(g2); g2.connect(g); o3.connect(g3); g3.connect(g);
    g.connect(this.musicG); g.connect(this.verb);
    o1.start(t); o2.start(t); o3.start(t);
    o1.stop(t+dur+0.02); o2.stop(t+dur+0.02); o3.stop(t+dur+0.02);
  },
  /* short brass-ish stab for accents */
  stab(t, f, dur, vol){
    const c = this.ctx;
    const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value=f;
    const fl = c.createBiquadFilter(); fl.type='lowpass';
    fl.frequency.setValueAtTime(f*7, t); fl.frequency.exponentialRampToValueAtTime(f*2.0, t+dur);
    fl.Q.value = 6;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(fl); fl.connect(g); g.connect(this.musicG); g.connect(this.verb);
    o.start(t); o.stop(t+dur+0.02);
  },
  playStep(t){
    const S = this.scene;
    if(S === 'off' || !this.musicG) return;
    const c = this.ctx;
    /* one chord per bar, with a 32-step melody phrase riding over them */
    const SC = {
      menu:    { root:60, prog:[[0,4,7,11],[-3,0,4,9],[-5,-1,2,7],[2,5,9,12]], vol:0.62,
                 mel:[12,null,14,16,null,14,12,null, 11,null,9,null,7,null,null,null,
                      9,null,11,12,null,11,9,null,  7,null,9,11,null,null,null,null] },
      live:    { root:60, prog:[[0,4,7],[7,11,14],[9,12,16],[5,9,12]], vol:0.70,
                 mel:[12,null,14,16,null,14,12,null, 11,null,9,11,null,14,null,null,
                      16,null,14,12,null,9,12,null,  7,9,11,12,null,null,null,null] },
      night:   { root:57, prog:[[0,4,7],[-3,0,4],[5,9,12],[2,5,9]], vol:0.52,
                 mel:[7,null,null,9,null,null,12,null, 11,null,null,9,null,null,null,null,
                      12,null,null,14,null,12,null,null, 9,null,7,null,null,null,null,null] },
      finale:  { root:60, prog:[[0,4,7,12],[5,9,12,17],[7,11,14,19],[0,4,7,12]], vol:0.92,
                 mel:[19,null,17,16,null,17,19,null, 16,null,14,12,null,14,16,null,
                      19,21,19,17,null,16,14,null,  12,14,16,19,null,null,null,null] },
      minigame:{ root:62, prog:[[0,3,7],[5,8,12],[7,10,14],[3,7,10]], vol:0.76,
                 mel:[12,12,null,15,null,14,12,null, 10,null,12,null,15,null,null,null,
                      17,null,15,14,null,12,10,null, 12,null,null,null,null,null,null,null] },
      report:  { root:60, prog:[[0,4,7],[-3,0,4],[5,9,12],[-1,2,7]], vol:0.55,
                 mel:[null,null,7,null,null,9,null,null, 12,null,null,null,null,null,null,null,
                      null,null,11,null,null,9,null,null, 7,null,null,null,null,null,null,null] },
    }[S] || { root:60, prog:[[0,4,7]], vol:0.5, mel:[] };

    const midi = m => 440*Math.pow(2,(m-69)/12);
    const bar = Math.floor(this.step/8) % SC.prog.length;
    const chord = SC.prog[bar];
    const b = this.step % 8;
    const ph = this.step % 32;
    const vol = SC.vol;
    const busy = (S==='live' || S==='finale' || S==='minigame' || S==='menu');

    /* --- pad: bright filtered saw stack, once per bar --- */
    if(b === 0){
      for(let i=0;i<chord.length;i++){
        const f = midi(SC.root+12+chord[i]);
        const o = c.createOscillator(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=(i-1)*9;
        const fl = c.createBiquadFilter(); fl.type='lowpass';
        fl.frequency.setValueAtTime(700,t); fl.frequency.linearRampToValueAtTime(2600,t+0.7);
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001,t);
        g.gain.linearRampToValueAtTime(0.026*vol, t+0.20);
        g.gain.linearRampToValueAtTime(0.0001, t+2.0);
        o.connect(fl); fl.connect(g); g.connect(this.musicG); g.connect(this.verb);
        o.start(t); o.stop(t+2.1);
      }
      if(S==='finale' || S==='live') this.stab(t, midi(SC.root+chord[0]), 0.34, 0.055*vol);
    }
    /* --- bouncy bass: root, octave, fifth --- */
    {
      const patt = [0,null,12,null, 7,null,12,null];
      const nb = patt[b];
      if(nb !== null){
        const f = midi(SC.root-12+chord[0]+nb);
        const o = c.createOscillator(); o.type='triangle'; o.frequency.value=f;
        const o2 = c.createOscillator(); o2.type='sine'; o2.frequency.value=f*0.5;
        const g = c.createGain();
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.115*vol,t+0.015);
        g.gain.exponentialRampToValueAtTime(0.0001,t+0.34);
        const g2 = c.createGain(); g2.gain.value=0.5;
        o.connect(g); o2.connect(g2); g2.connect(g); g.connect(this.musicG);
        o.start(t); o2.start(t); o.stop(t+0.36); o2.stop(t+0.36);
      }
    }
    /* --- steel-drum comping --- */
    const comp = { menu:[0,1,0,1,0,1,0,1], live:[1,0,1,1,0,1,1,0], night:[1,0,0,1,0,0,1,0],
                   finale:[1,1,1,1,1,1,1,1], minigame:[1,0,1,0,1,1,0,1], report:[1,0,0,0,1,0,0,0] }[S]
                || [1,0,1,0,1,0,1,0];
    if(comp[b]){
      const note = chord[(this.step*2+b) % chord.length];
      this.bell(t, midi(SC.root+12+note), 0.50, 0.048*vol, 0.30);
    }
    /* --- melody hook --- */
    if(SC.mel && SC.mel.length){
      const m = SC.mel[ph];
      if(m !== null && m !== undefined){
        this.bell(t, midi(SC.root+12+m), 0.62, 0.085*vol, 0.55);
        if(S==='finale') this.bell(t, midi(SC.root+24+m), 0.42, 0.030*vol, 0.7);
      }
    }
    /* --- percussion --- */
    if(S !== 'report'){
      const kick = [1,0,0,1,0,0,1,0];
      if(kick[b]) this.kick(t, vol);
      if(b===2 || b===6) this.clap(t, vol*(S==='night'?0.5:1));
      if(busy){
        this.shaker(t, vol*(b%2?0.55:0.95));
        this.shaker(t + (60/this.bpm/4), vol*0.4);
      } else if(b%2===0) this.shaker(t, vol*0.5);
      if(S==='finale' || S==='minigame') this.hat(t, vol*(b%2?0.4:0.7));
    }
  },
  kick(t, v){
    const c=this.ctx;
    const o=c.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(165,t); o.frequency.exponentialRampToValueAtTime(45,t+0.11);
    const g=c.createGain(); g.gain.setValueAtTime(0.34*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.26);
    o.connect(g); g.connect(this.musicG); o.start(t); o.stop(t+0.28);
    const s=c.createBufferSource(); s.buffer=this.noiseBuf;
    const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    const g2=c.createGain(); g2.gain.setValueAtTime(0.07*v,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
    s.connect(f); f.connect(g2); g2.connect(this.musicG); s.start(t); s.stop(t+0.05);
  },
  /* hand clap: three quick bursts — the festival backbeat */
  clap(t, v){
    const c=this.ctx;
    for(let i=0;i<3;i++){
      const ts = t + i*0.009;
      const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=1.4+i*0.1;
      const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1550; f.Q.value=1.5;
      const g=c.createGain();
      g.gain.setValueAtTime(0.10*v*(i===2?1.25:0.7),ts);
      g.gain.exponentialRampToValueAtTime(0.0001, ts+(i===2?0.16:0.05));
      s.connect(f); f.connect(g); g.connect(this.musicG); g.connect(this.verb);
      s.start(ts); s.stop(ts+0.18);
    }
  },
  shaker(t, v){
    const c=this.ctx;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=3.1;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=6200;
    const g=c.createGain(); g.gain.setValueAtTime(0.040*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);
    s.connect(f); f.connect(g); g.connect(this.musicG);
    s.start(t); s.stop(t+0.06);
  },
  snare(t, v){
    const c=this.ctx;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.8;
    const g=c.createGain(); g.gain.setValueAtTime(0.13*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.15);
    s.connect(f); f.connect(g); g.connect(this.musicG); g.connect(this.verb);
    s.start(t); s.stop(t+0.16);
  },
  hat(t, v){
    const c=this.ctx;
    const s=c.createBufferSource(); s.buffer=this.noiseBuf; s.playbackRate.value=2.4;
    const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=7600;
    const g=c.createGain(); g.gain.setValueAtTime(0.05*v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.055);
    s.connect(f); f.connect(g); g.connect(this.musicG);
    s.start(t); s.stop(t+0.07);
  }
};

/* ===========================================================================
   28. FX — particles, toasts, floats, camera shake
   =========================================================================== */
const FX = {
  parts:[], free:[], max:5200,
  shake:0, shakeT:0,
  toastEl:null, floatEl:null,
  init(){ this.toastEl = $('#toasts'); this.floatEl = $('#floats'); },
  p(x,y,z, vx,vy,vz, life, size, r,g,b, opt){
    if(this.parts.length >= this.max*QUALITY.particles) return;
    opt = opt||{};
    let o = this.free.pop();
    if(!o) o = {};
    o.x=x;o.y=y;o.z=z; o.vx=vx;o.vy=vy;o.vz=vz;
    o.life=life; o.maxLife=life; o.size=size; o.size0=size;
    o.r=r;o.g=g;o.b=b;
    o.grav = opt.grav===undefined?-9.0:opt.grav;
    o.drag = opt.drag===undefined?0.72:opt.drag;
    o.add = opt.add!==false;
    o.kind = opt.kind||0;
    o.rot = opt.rot||0; o.spin = opt.spin||0;
    o.fade = opt.fade||1;
    o.grow = opt.grow||0;
    o.a0 = opt.alpha===undefined?1:opt.alpha;
    o.seed = Math.random();
    o.trail = opt.trail||0;
    this.parts.push(o);
    return o;
  },
  update(dt){
    const P = this.parts;
    for(let i=P.length-1;i>=0;i--){
      const o = P[i];
      o.life -= dt;
      if(o.life <= 0){ P.splice(i,1); this.free.push(o); continue; }
      o.vy += o.grav*dt;
      const d = Math.exp(-o.drag*dt);
      o.vx*=d; o.vy*=d; o.vz*=d;
      o.x += o.vx*dt; o.y += o.vy*dt; o.z += o.vz*dt;
      o.rot += o.spin*dt;
      if(o.grow) o.size = o.size0*(1 + o.grow*(1-o.life/o.maxLife));
      if(o.y < 0.02 && o.grav < 0){ o.y = 0.02; o.vy *= -0.24; o.vx*=0.6; o.vz*=0.6; }
    }
    if(this.shakeT > 0){ this.shakeT -= dt; if(this.shakeT<=0) this.shake = 0; }
  },
  draw(){
    for(const o of this.parts){
      const t = o.life/o.maxLife;
      const a = Math.pow(clamp01(t), o.fade)*o.a0;
      RD.part(o.add, o.x,o.y,o.z, o.size, o.r*a, o.g*a, o.b*a, a, o.rot, o.kind, o.trail, o.seed);
    }
  },
  clear(){ for(const o of this.parts) this.free.push(o); this.parts.length = 0; },
  /* ---- presets ---- */
  burst(x,z,color,n,y){
    const c = typeof color==='string'?hex2rgb(color):color;
    y = y===undefined?1.2:y;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=1.6+Math.random()*4.2;
      this.p(x,y,z, Math.cos(a)*sp, 2.2+Math.random()*3.4, Math.sin(a)*sp,
             0.6+Math.random()*0.5, 0.16+Math.random()*0.14, c[0],c[1],c[2], {grav:-7,drag:1.5});
    }
  },
  sparkle(x,y,z,color,n){
    const c = typeof color==='string'?hex2rgb(color):color;
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=0.4+Math.random()*1.4;
      this.p(x,y,z, Math.cos(a)*sp, Math.random()*1.6, Math.sin(a)*sp,
             0.5+Math.random()*0.6, 0.09+Math.random()*0.07, c[0],c[1],c[2], {grav:-1.2,drag:1.1});
    }
  },
  smoke(x,y,z,n,dark){
    for(let i=0;i<n;i++){
      const a=Math.random()*TAU, sp=0.3+Math.random()*0.9;
      const v = dark?0.16:0.6;
      this.p(x,y,z, Math.cos(a)*sp, 0.5+Math.random()*0.8, Math.sin(a)*sp,
             1.6+Math.random()*1.4, 0.5+Math.random()*0.6, v,v,v*1.06,
             {grav:0.4,drag:0.9,add:false,alpha:0.30,grow:1.8,fade:1.6});
    }
  },
  confetti(x,y,z,n){
    const cols=[[1,0.42,0.36],[1,0.82,0.4],[0.31,0.77,0.72],[0.61,0.55,1],[1,0.55,0.72],[0.42,0.71,1]];
    for(let i=0;i<n;i++){
      const c = cols[i%cols.length];
      const a=Math.random()*TAU, sp=2+Math.random()*7;
      this.p(x,y,z, Math.cos(a)*sp, 4+Math.random()*7, Math.sin(a)*sp,
             3.5+Math.random()*3, 0.14+Math.random()*0.10, c[0],c[1],c[2],
             {grav:-5.2,drag:0.85,add:false,alpha:0.95,spin:(Math.random()-0.5)*12,fade:0.6});
    }
  },
  firework(x,y,z, color, power, shape){
    const c = typeof color==='string'?hex2rgb(color):color;
    const n = Math.round(power*(QUALITY.particles));
    AUDIO.sfx('boom');
    setTimeout(()=>AUDIO.sfx('crackle'), 120);
    this.flash(0.30, c);
    /* shockwave ring */
    this.p(x,y,z, 0,0,0, 0.5, 1.5, c[0],c[1],c[2], {grav:0,drag:0,add:true,kind:2,grow:11,fade:2.2,alpha:0.85});
    for(let i=0;i<n;i++){
      let dx,dy,dz;
      if(shape==='ring'){
        const a=i/n*TAU; const tilt=0.35;
        dx=Math.cos(a); dy=Math.sin(a)*tilt; dz=Math.sin(a);
      } else if(shape==='willow'){
        const a=Math.random()*TAU, u=Math.random();
        const ph=Math.acos(1-u*1.1);
        dx=Math.sin(ph)*Math.cos(a); dy=Math.cos(ph)*0.9; dz=Math.sin(ph)*Math.sin(a);
      } else if(shape==='heart'){
        const t=i/n*TAU;
        dx=16*Math.pow(Math.sin(t),3)/16;
        dy=(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/16;
        dz=(Math.random()-0.5)*0.28;
      } else {
        const a=Math.random()*TAU, u=Math.random()*2-1, s=Math.sqrt(1-u*u);
        dx=s*Math.cos(a); dy=u; dz=s*Math.sin(a);
      }
      const sp = (shape==='willow'? 7+Math.random()*5 : 10+Math.random()*9);
      const cc = Math.random()<0.15 ? [1,1,1] : c;
      this.p(x,y,z, dx*sp, dy*sp, dz*sp,
             (shape==='willow'?2.6:1.5)+Math.random()*1.2,
             0.20+Math.random()*0.16, cc[0]*1.7,cc[1]*1.7,cc[2]*1.7,
             {grav:shape==='willow'?-3.4:-5.0, drag:shape==='willow'?0.45:0.72, kind:1, trail:0.5,
              rot:Math.random()*TAU, fade:1.5});
    }
  },
  rocket(x,z, tx,ty,tz, color, power, shape, delay){
    setTimeout(()=>{
      AUDIO.sfx('launch');
      const dur = 1.05;
      const o = this.p(x, 1.0, z, (tx-x)/dur, (ty-1.0)/dur + 4.9*dur, (tz-z)/dur, dur, 0.22,
             1.0,0.75,0.35, {grav:-9.8, drag:0.02, kind:1, trail:1.2});
      const iv = setInterval(()=>{
        if(!o || o.life<=0){ clearInterval(iv); return; }
        this.p(o.x,o.y,o.z, (Math.random()-0.5)*0.6, -0.4, (Math.random()-0.5)*0.6, 0.42, 0.13,
               1.0,0.6,0.22, {grav:-1,drag:1.6,kind:0,fade:2});
      }, 26);
      setTimeout(()=>{ clearInterval(iv); this.firework(tx,ty,tz,color,power,shape); }, dur*1000);
    }, delay||0);
  },
  flash(amt, col){
    RD.flash = Math.max(RD.flash, amt);
    if(col) RD.flashCol = col;
  },
  camShake(amt, dur){
    if(!SETTINGS.camShake || SETTINGS.reduceMotion) return;
    this.shake = Math.max(this.shake, amt); this.shakeT = Math.max(this.shakeT, dur||0.4);
  },
  /* ---- DOM effects ---- */
  pushToast(msg, kind, ms){
    const g = { ok:'✅', err:'⚠️', warn:'⚡', info:'ℹ️', gold:'💰' }[kind] || '';
    const n = el('div',{class:'toast '+(kind||'')}, g?el('span',{class:'g',text:g}):null, el('span',{html:msg}));
    this.toastEl.appendChild(n);
    while(this.toastEl.children.length > 5) this.toastEl.removeChild(this.toastEl.firstChild);
    setTimeout(()=>{ n.classList.add('out'); setTimeout(()=>n.remove(), 280); }, ms||2600);
  },
  floatWorld(x,z,text,color,y){
    if(!CAM.projectToScreen) return;
    const p = CAM.projectToScreen(x, (y===undefined?1.8:y), z);
    if(!p) return;
    this.floatScreen(p.x, p.y, text, color);
  },
  floatScreen(sx,sy,text,color){
    if(this.floatEl.children.length > 26) return;
    const n = el('div',{class:'float', style:{ left:sx+'px', top:sy+'px', color:color||'#fff' }, text});
    this.floatEl.appendChild(n);
    setTimeout(()=>n.remove(), 1350);
  },
  bigMsg(title, sub, ms){
    const b = $('#bigmsg');
    b.querySelector('b').textContent = title;
    b.querySelector('span').textContent = sub||'';
    b.classList.add('on');
    clearTimeout(this._bigT);
    this._bigT = setTimeout(()=>b.classList.remove('on'), ms||2400);
  }
};
/* ===========================================================================
   29. INPUT
   =========================================================================== */
const IN = {
  keys:new Set(), mx:0, my:0, mdx:0, mdy:0, wheel:0,
  down:[false,false,false], clicked:[false,false,false], released:[false,false,false],
  locked:false, overUI:false,
  init(){
    addEventListener('keydown', e=>{
      if(e.repeat) { return; }
      const k = e.key.length===1 ? e.key.toLowerCase() : e.key;
      this.keys.add(k);
      if(['w','a','s','d','q','e',' ','Tab'].indexOf(k)>=0 && !UI.modalOpen && document.activeElement === document.body) e.preventDefault();
      Bus.emit('key', k, e);
    });
    addEventListener('keyup', e=>{ this.keys.delete(e.key.length===1?e.key.toLowerCase():e.key); });
    addEventListener('blur', ()=>this.keys.clear());
    CV.addEventListener('mousemove', e=>{
      if(this.locked){ this.mdx += e.movementX||0; this.mdy += e.movementY||0; }
      else { this.mdx += e.movementX||0; this.mdy += e.movementY||0; }
      this.mx = e.clientX; this.my = e.clientY;
    });
    addEventListener('mousemove', e=>{ if(!this.locked){ this.mx=e.clientX; this.my=e.clientY; } });
    CV.addEventListener('mousedown', e=>{ this.down[e.button]=true; this.clicked[e.button]=true; AUDIO.resume(); });
    addEventListener('mouseup', e=>{ this.down[e.button]=false; this.released[e.button]=true; });
    CV.addEventListener('contextmenu', e=>e.preventDefault());
    CV.addEventListener('wheel', e=>{ this.wheel += Math.sign(e.deltaY); e.preventDefault(); }, {passive:false});
    document.addEventListener('pointerlockchange', ()=>{
      this.locked = document.pointerLockElement === CV;
      document.body.classList.toggle('nopointer', this.locked);
      if(!this.locked && CAM.mode==='ground' && !UI.modalOpen && W.stage==='live') UI.showGroundHint();
    });
  },
  endFrame(){ this.mdx=0; this.mdy=0; this.wheel=0; this.clicked=[false,false,false]; this.released=[false,false,false]; },
  key(k){ return this.keys.has(k); },
  lock(){ if(!this.locked && CV.requestPointerLock) CV.requestPointerLock(); },
  unlock(){ if(this.locked && document.exitPointerLock) document.exitPointerLock(); }
};

/* ===========================================================================
   30. CAMERA
   =========================================================================== */
const CAM = {
  mode:'overview',
  /* overview */
  tx:0, tz:-4, dist:64, yaw:0.55, pitch:0.72,
  tdist:64, tyaw:0.55, tpitch:0.72, ttx:0, ttz:-4,
  /* ground */
  gx:0, gy:1.68, gz:-24, gyaw:PI, gpitch:-0.05,
  /* shared */
  eye:new Float32Array(3), tgt:new Float32Array(3),
  fov:52, near:0.35, far:620,
  cine:null, cineT:0,
  vpW:0, vpH:0,
  init(){
    this.tx = 0; this.tz = -4; this.dist = 92; this.tdist = 64;
    this.yaw = this.tyaw = 0.62; this.pitch = this.tpitch = 0.86;
    this.ttx = 0; this.ttz = -4;
  },
  setMode(m){
    if(this.mode === m) return;
    const prev = this.mode;
    this.mode = m;
    if(m === 'ground'){
      /* drop into the world near the current overview target */
      const f = NAV.nearestFree(this.tx, this.tz+6, 12);
      this.gx = f?NAV.cx(f[0]):0; this.gz = f?NAV.cz(f[1]):-20;
      this.gyaw = this.yaw + PI; this.gpitch = -0.05;
      document.body.classList.add('ground-active');
      $('#groundhud').classList.add('on');
      UI.showGroundHint();
    } else {
      document.body.classList.remove('ground-active');
      $('#groundhud').classList.remove('on');
      IN.unlock();
      if(prev === 'ground'){ this.ttx = this.gx; this.ttz = this.gz; this.tx=this.gx; this.tz=this.gz; }
    }
    Bus.emit('cammode', m);
    UI.rebuild();
  },
  update(dt){
    if(this.mode === 'cine'){ this.updateCine(dt); return; }
    if(this.mode === 'ground') this.updateGround(dt);
    else this.updateOverview(dt);
  },
  updateOverview(dt){
    const spd = (IN.key('Shift')?2.4:1) * this.dist*0.55;
    let mx=0, mz=0;
    if(!UI.modalOpen && !UI.typing){
      if(IN.key('w')||IN.key('ArrowUp')) mz -= 1;
      if(IN.key('s')||IN.key('ArrowDown')) mz += 1;
      if(IN.key('a')||IN.key('ArrowLeft')) mx -= 1;
      if(IN.key('d')||IN.key('ArrowRight')) mx += 1;
      if(IN.key('q')) this.tyaw -= dt*1.5;
      if(IN.key('e')) this.tyaw += dt*1.5;
      /* edge scroll */
      if(SETTINGS.edgeScroll && !IN.overUI){
        const m=22;
        if(IN.mx < m) mx -= 1; else if(IN.mx > innerWidth-m) mx += 1;
        if(IN.my < m) mz -= 1; else if(IN.my > innerHeight-m) mz += 1;
      }
    }
    /* middle / right drag */
    if(IN.down[1] || (IN.down[2] && IN.key('Shift'))){
      const s = this.dist*0.0016;
      const c=Math.cos(this.yaw), sn=Math.sin(this.yaw);
      this.ttx -= (IN.mdx*c - IN.mdy*sn)*s*1.4;
      this.ttz -= (IN.mdx*sn + IN.mdy*c)*s*1.4;
    } else if(IN.down[2]){
      this.tyaw += IN.mdx*0.0042*SETTINGS.sens;
      this.tpitch = clamp(this.tpitch + IN.mdy*0.0035*SETTINGS.sens*(SETTINGS.invertY?-1:1), 0.26, 1.40);
    }
    if(mx||mz){
      const l=Math.hypot(mx,mz); mx/=l; mz/=l;
      const c=Math.cos(this.yaw), sn=Math.sin(this.yaw);
      this.ttx += (mx*c - mz*sn)*spd*dt;
      this.ttz += (mx*sn + mz*c)*spd*dt;
    }
    if(IN.wheel && !IN.overUI){
      this.tdist = clamp(this.tdist * (1 + IN.wheel*0.13), 14, 150);
    }
    this.ttx = clamp(this.ttx, -62, 62);
    this.ttz = clamp(this.ttz, -44, 34);
    this.tx = damp(this.tx, this.ttx, 11, dt);
    this.tz = damp(this.tz, this.ttz, 11, dt);
    this.dist = damp(this.dist, this.tdist, 9, dt);
    this.yaw = damp(this.yaw, this.tyaw, 12, dt);
    this.pitch = damp(this.pitch, this.tpitch, 12, dt);
    /* auto-tilt: closer = lower angle */
    const autoP = lerp(0.42, 1.02, clamp01((this.dist-14)/120));
    this.pitch = lerp(this.pitch, clamp(this.pitch, Math.max(0.26, autoP*0.42), autoP*1.35), 0.15);
    const cp = Math.cos(this.pitch), sp = Math.sin(this.pitch);
    this.eye[0] = this.tx + Math.sin(this.yaw)*cp*this.dist;
    this.eye[1] = sp*this.dist + 1.5;
    this.eye[2] = this.tz + Math.cos(this.yaw)*cp*this.dist;
    this.tgt[0] = this.tx; this.tgt[1] = 1.2; this.tgt[2] = this.tz;
    this.fov = 50;
  },
  updateGround(dt){
    if(IN.locked && !UI.modalOpen){
      this.gyaw -= IN.mdx*0.0022*SETTINGS.sens;
      this.gpitch = clamp(this.gpitch - IN.mdy*0.0022*SETTINGS.sens*(SETTINGS.invertY?-1:1), -1.35, 1.35);
    }
    let fx=0, fz=0;
    if(!UI.modalOpen && !UI.typing){
      if(IN.key('w')) fz += 1;
      if(IN.key('s')) fz -= 1;
      if(IN.key('a')) fx -= 1;
      if(IN.key('d')) fx += 1;
    }
    const run = IN.key('Shift') ? 2.15 : 1;
    const sp = 3.1*run;
    if(fx||fz){
      const l=Math.hypot(fx,fz); fx/=l; fz/=l;
      const c=Math.cos(this.gyaw), s=Math.sin(this.gyaw);
      /* forward = (sin yaw, cos yaw); camera right = cross(up, back) = (-cos yaw, sin yaw).
         The old basis used (cos yaw, -sin yaw), i.e. exactly -right, so A and D were swapped. */
      let dx = (fz*s - fx*c)*sp*dt;
      let dz = (fz*c + fx*s)*sp*dt;
      /* collide */
      const R = 0.42;
      if(NAV.free(NAV.col(this.gx+dx+sign(dx)*R), NAV.row(this.gz))) this.gx += dx;
      if(NAV.free(NAV.col(this.gx), NAV.row(this.gz+dz+sign(dz)*R))) this.gz += dz;
      this.headBob = (this.headBob||0) + dt*sp*1.7;
    } else this.headBob = damp(this.headBob||0, 0, 6, dt);
    this.gx = clamp(this.gx, -55, 55); this.gz = clamp(this.gz, -38, 27);
    const ground = terrainH(this.gx, this.gz);
    const bob = Math.sin(this.headBob*2)*0.035 + Math.sin(this.headBob)*0.018;
    this.gy = damp(this.gy, ground + 1.68 + (SETTINGS.reduceMotion?0:bob), 14, dt);
    this.eye[0]=this.gx; this.eye[1]=this.gy; this.eye[2]=this.gz;
    const cp = Math.cos(this.gpitch);
    this.tgt[0]=this.gx + Math.sin(this.gyaw)*cp;
    this.tgt[1]=this.gy + Math.sin(this.gpitch);
    this.tgt[2]=this.gz + Math.cos(this.gyaw)*cp;
    this.fov = 62 + (run>1?5:0);
  },
  startCine(keys, dur, onDone){
    this.mode='cine'; this.cine = keys; this.cineDur = dur; this.cineT = 0; this.cineDone = onDone;
  },
  updateCine(dt){
    this.cineT += dt;
    const t = clamp01(this.cineT/this.cineDur);
    const K = this.cine;
    const n = K.length-1;
    const ft = t*n;
    const i = Math.min(n-1, Math.floor(ft));
    const lt = smootherstep(0,1, ft-i);
    const a = K[i], b = K[i+1];
    for(let k=0;k<3;k++){
      this.eye[k] = lerp(a.eye[k], b.eye[k], lt);
      this.tgt[k] = lerp(a.tgt[k], b.tgt[k], lt);
    }
    this.fov = lerp(a.fov||46, b.fov||46, lt);
    if(t >= 1 && this.cineDone){ const f=this.cineDone; this.cineDone=null; f(); }
  },
  apply(){
    let ex=this.eye[0], ey=this.eye[1], ez=this.eye[2];
    if(FX.shake > 0.001){
      const s = FX.shake*Math.min(1, FX.shakeT*3);
      ex += (Math.random()-0.5)*s; ey += (Math.random()-0.5)*s; ez += (Math.random()-0.5)*s;
    }
    RD.setCamera([ex,ey,ez], this.tgt, this.fov, this.near, this.far);
    const fx = this.mode==='ground'?this.gx:this.tx, fz = this.mode==='ground'?this.gz:this.tz;
    RD.updateShadow(fx, fz, this.mode==='ground'? 40 : clamp(this.dist*0.85, 34, 92));
  },
  /* screen -> ground plane */
  screenRay(sx, sy){
    const nx = (sx/innerWidth)*2-1, ny = 1-(sy/innerHeight)*2;
    const p0 = M4.xformPoint(V3.n(), RD.invVP, [nx,ny,-1]);
    const p1 = M4.xformPoint(V3.n(), RD.invVP, [nx,ny,1]);
    const dx=p1[0]-p0[0], dy=p1[1]-p0[1], dz=p1[2]-p0[2];
    return { ox:p0[0], oy:p0[1], oz:p0[2], dx,dy,dz };
  },
  groundPick(sx, sy, planeY){
    const r = this.screenRay(sx,sy);
    if(Math.abs(r.dy) < 1e-6) return null;
    const t = ((planeY||0) - r.oy)/r.dy;
    if(t < 0) return null;
    return { x: r.ox + r.dx*t, z: r.oz + r.dz*t };
  },
  projectToScreen(x,y,z){
    const vp = RD.vp;
    const w = vp[3]*x + vp[7]*y + vp[11]*z + vp[15];
    if(w <= 0.02) return null;
    const cx = (vp[0]*x + vp[4]*y + vp[8]*z + vp[12])/w;
    const cy = (vp[1]*x + vp[5]*y + vp[9]*z + vp[13])/w;
    return { x:(cx*0.5+0.5)*innerWidth, y:(1-(cy*0.5+0.5))*innerHeight, w };
  }
};
/* ===========================================================================
   31. SCENE RENDERING
   =========================================================================== */
const TMP = M4.n(), TMP2 = M4.n();
const SCENE = {
  statics:[], labels:[], labelPool:[], labelRoot:null,
  build(){
    this.statics.length = 0;
    const R = makeRNG(77321);
    const add = (mesh,x,z,ry,s,col,emit,y)=>{
      const c = col?hex2rgb(col):[1,1,1];
      this.statics.push({ mesh, x, y:(y===undefined?terrainH(x,z):y), z, ry, s, r:c[0],g:c[1],b:c[2], e:emit||0 });
    };
    /* palms + pines along the perimeter */
    for(let i=0;i<44;i++){
      const side = i%4;
      let x,z;
      if(side===0){ x = R.range(-108,-56); z = R.range(-42,24); }
      else if(side===1){ x = R.range(56,108); z = R.range(-42,24); }
      else if(side===2){ x = R.range(-100,100); z = R.range(-56,-36); }
      else { x = R.range(-104,-58); z = R.range(24,29); }
      if(Math.abs(x)<54 && z>-35 && z<28) continue;
      add(R.chance(0.62)?'palm':'pine', x, z, R.range(0,TAU), R.range(0.82,1.3),
          R.chance(0.5)?'#5fae63':'#4f9d5c');
    }
    for(let i=0;i<34;i++){
      const x = R.range(56,104), z = R.range(24,30);
      add(R.chance(0.7)?'palm':'pine', x, z, R.range(0,TAU), R.range(0.8,1.2));
    }
    /* grass tufts on dunes */
    for(let i=0;i<220;i++){
      const x = R.range(-112,112), z = R.range(-56,30);
      if(Math.abs(x)<54 && z>-35 && z<28) continue;
      if(terrainH(x,z) < 0.5) continue;
      add('grass', x, z, R.range(0,TAU), R.range(0.8,1.8), R.chance(0.4)?'#8fbf6f':'#6fa855');
    }
    /* breakwater rocks */
    for(let i=0;i<40;i++){
      const t = i/40;
      const sideL = i%2===0;
      const bx = sideL ? lerp(-52,-96,t) : lerp(52,96,t);
      const bz = 28 + Math.sin(t*3.4)*3 + t*13;
      add('rock', bx + R.range(-4,4), bz + R.range(-3,3), R.range(0,TAU), R.range(1.1,3.4),
          R.chance(0.5)?'#7d7b78':'#6a6865', 0, -0.6+R.range(0,0.8));
    }
    for(let i=0;i<16;i++){
      const x=R.range(-105,105), z=R.range(-58,-44);
      add('rock', x, z, R.range(0,TAU), R.range(1.4,3.6), '#75736f');
    }
    /* beach umbrellas + chairs (outside the build grid) */
    for(let i=0;i<26;i++){
      const left = R.chance(0.5);
      const x = left ? R.range(-96,-56) : R.range(56,96);
      const z = R.range(21,27);
      add('umbrella', x, z, R.range(0,TAU), R.range(0.9,1.15), R.pick(['#f7a797','#ffe6a8','#b0ecd8','#bcd8f5','#ffc9dc']));
      add('chair', x+R.range(-2.5,2.5), z+R.range(-1.5,1.5), R.range(0,TAU), 1);
    }
    /* buoys in the water */
    for(let i=0;i<22;i++){
      add('buoy', R.range(-100,100), R.range(32,62), 0, R.range(0.9,1.4), R.pick(['#f6a595','#ffe6a8','#b0ecd8']), 0, -0.55);
    }
    /* promenade lamps along the emergency lanes */
    for(let z=-30; z<=13; z+=7.5){
      add('streetlamp', -5.2, z, 0, 1);
      add('streetlamp',  5.2, z, PI, 1);
    }
    for(let x=-46; x<=46; x+=11){
      if(Math.abs(x)<7) continue;
      add('streetlamp', x, 17.2, PI/2, 1);
    }
    /* balloons at the gate and along the beach approach */
    for(const [bx,bz] of [[-8.5,-29.5],[8.5,-29.5],[-13,-24],[13,-24],
                          [-26,17.2],[26,17.2],[-40,17.2],[40,17.2],[0,-27.5]]){
      add('balloons', bx, bz, R.range(0,TAU), R.range(0.92,1.18));
    }
    /* bunting strung between the promenade lamps (lanes are unbuildable) */
    for(let z=-26.5; z<=10; z+=7.5){
      add('bunting', -5.2, z, 0, 1, null, 0, 3.15);
      add('bunting',  5.2, z, 0, 1, null, 0, 3.15);
    }
    for(let x=-40; x<=40; x+=11){
      if(Math.abs(x)<8) continue;
      add('bunting', x, 17.2, PI/2, 1, null, 0, 3.15);
    }
    /* perimeter flags */
    for(let i=0;i<18;i++){
      const t=i/17;
      add('flag', lerp(-50,50,t), -35.5, PI, R.range(0.9,1.15),
          ['#ffb8a8','#ffe6a8','#a8e4dc','#bcd8f5','#d8bcf0'][i%5]);
    }
    for(let i=0;i<10;i++){
      add('flag', -54.5, lerp(-30,18,i/9), PI/2, 1, ['#a8e4dc','#ffe6a8','#ffb8a8'][i%3]);
      add('flag',  54.5, lerp(-30,18,i/9), -PI/2, 1, ['#bcd8f5','#ffc9dc','#b8ecd8'][i%3]);
    }
    /* surfboards + crates near the beach edges */
    for(let i=0;i<10;i++){
      const x = R.chance(0.5)? R.range(-90,-58) : R.range(58,90);
      add('surfboard', x, R.range(22,26), R.range(0,TAU), 1, R.pick(['#fbfdff','#ffe6a8','#f7a797','#b0ecd8']));
    }
    this.labelRoot = el('div',{ class:'no-pe', style:{position:'fixed', inset:'0', zIndex:'12', pointerEvents:'none'} });
    document.body.appendChild(this.labelRoot);
  },
  /* --------------- draw --------------- */
  draw(dt){
    const night = ATMO.night;
    /* terrain + statics */
    M4.trsY(TMP, 0,0,0, 0, 1,1,1);
    RD.mNC('terrain', TMP, 1,1,1, 0, 0.9, 1, 0, 0);
    for(const s of this.statics){
      M4.trsY(TMP, s.x, s.y, s.z, s.ry, s.s, s.s, s.s);
      RD.m(s.mesh, TMP, s.r, s.g, s.b, s.e + (s.mesh==='streetlamp'? night*1.4 : 0), 0.7, 1, 0, 0);
    }
    /* facilities */
    for(const f of W.facilities){
      const ry = f.rot*PI/2;
      const c = hex2rgb(f.def.color);
      let flags = 0;
      if(BUILD.selected === f) flags |= 1;
      const dim = f.active ? 1 : 0.45;
      M4.trsY(TMP, f.x, terrainH(f.x,f.z), f.z, ry, 1,1,1);
      RD.m(f.def.mesh, TMP, c[0]*dim, c[1]*dim, c[2]*dim, f.active? night*0.55 : 0, 0.6, 1, 0, flags);
      /* program podium markers */
      if(f.programs) for(let i=0;i<f.programs.length;i++){
        const p = f.programs[i];
        if(!p) continue;
        const active = p.slot === W.slot && !p.done && W.stage==='live';
        const off = (i - (f.programs.length-1)/2)*1.4;
        const px = f.x + Math.cos(ry)*off, pz = f.z - Math.sin(ry)*off;
        M4.trsY(TMP, px, terrainH(px,pz)+0.05, pz, RD.time*1.2, 1,1,1);
        const pc = active ? [1,0.82,0.4] : [0.55,0.6,0.7];
        RD.m('progmark', TMP, pc[0],pc[1],pc[2], active?1.6:0.2, 0.5,1,0, active?1:0);
        if(active && Math.random() < dt*7) FX.sparkle(px, 1.4, pz, '#ffd166', 1);
      }
      /* queue footprint decal */
      if(f.slots && f.slots.length && W.stage==='live' && f.queue.length){
        const q = f.queue.length/f.def.queueMax;
        const col = q>0.8?[1,0.28,0.34]:(q>0.5?[1,0.72,0.2]:[0.3,0.85,0.72]);
        for(let i=0;i<Math.min(f.queue.length+1, f.slots.length);i++){
          const s = f.slots[i];
          RD.decal(s.x, s.z, 0.5,0.5, 0, col[0],col[1],col[2], 0.30, 2, 0.1, i*0.4);
        }
      }
      /* disabled marker */
      if(!f.active){
        RD.decal(f.x, f.z, f.fw*1.6, f.fh*1.6, 0, 1,0.3,0.2, 0.35, 1, 0.1, 0);
      }
    }
    /* emergency lanes (subtle) */
    if(W.stage==='setup' || W.stage==='morning' || BUILD.mode){
      for(const L of LANES){
        const cx = (cellCX(L.c0)+cellCX(L.c1))/2, cz = (cellCZ(L.r0)+cellCZ(L.r1))/2;
        const hw = (L.c1-L.c0+1)*GRID.cell/2, hd = (L.r1-L.r0+1)*GRID.cell/2;
        RD.decal(cx, cz, hw, hd, 0, 0.35,0.72,1, 0.14, 0, 0.03, 0);
      }
    }
    /* events */
    for(const ev of W.events){
      if(ev.done && ev.fadeT > 1.6) continue;
      const c = ev.def.good ? [1,0.82,0.4] : (ev.def.sev>=3?[1,0.3,0.35]:[1,0.68,0.2]);
      const a = ev.done ? clamp01(1-(ev.fadeT||0)/1.6) : 1;
      const yy = terrainH(ev.x,ev.z);
      M4.trsY(TMP, ev.x, yy, ev.z, RD.time*0.9, 1.2,1.2,1.2);
      RD.m('beacon', TMP, c[0],c[1],c[2], (2.2 + Math.sin(RD.time*4)*0.9)*a, 0.5,1,0, 0);
      RD.decal(ev.x, ev.z, 3.4,3.4, 0, c[0],c[1],c[2], 0.42*a, 1, 0.1, ev.id);
      if(!ev.done && Math.random() < dt*9){
        if(ev.def.id==='litter') FX.smoke(ev.x, 0.5, ev.z, 1, true);
        else if(ev.def.id==='heatwave') FX.p(ev.x+(Math.random()-0.5)*5, yy+0.6, ev.z+(Math.random()-0.5)*5, 0,0.7,0, 1.4, 0.5, 1,0.6,0.25, {grav:0.2,drag:0.9,add:false,alpha:0.18,grow:1.4});
        else if(ev.def.good) FX.sparkle(ev.x, 1.6, ev.z, '#ffd166', 1);
        else FX.p(ev.x+(Math.random()-0.5)*2, yy+1.2, ev.z+(Math.random()-0.5)*2, 0,1.1,0, 1.0, 0.32, c[0],c[1],c[2], {grav:0.4,drag:1.2,alpha:0.5});
      }
    }
    /* crowd */
    this.drawCrowd(dt);
    /* build preview */
    BUILD.draw();
    /* labels */
    this.updateLabels();
  },
  drawCrowd(dt){
    const cam = RD.camPos;
    const legLOD = 34*34, headLOD = 190*190, hairLOD = 95*95;
    const HATS = [null,'npc_cap','npc_bucket','npc_beanie'];
    for(const n of W.npcs){
      const gy = terrainH(n.x,n.z);
      const d2 = dist2(n.x,n.z,cam[0],cam[2]);
      const s = n.scale;
      const hip = gy + CH.hip*s + n.bob*s;
      const ry = n.dir;
      M4.trsY(TMP, n.x, hip, n.z, ry, s,s,s);
      RD.m('npc_body', TMP, n.colShirt[0],n.colShirt[1],n.colShirt[2], 0, 0.55, 1, 0, 0);
      if(n.hasBag && d2 < hairLOD) RD.m('npc_bag', TMP, n.colBag[0],n.colBag[1],n.colBag[2], 0, 0.5, 1, 0, 0);
      if(d2 < headLOD){
        M4.trsY(TMP2, n.x, gy + CH.neck*s + n.bob*s, n.z, ry, s,s,s);
        RD.m('npc_head', TMP2, n.colSkin[0],n.colSkin[1],n.colSkin[2], 0, 0.5, 1, 0, 0);
        if(d2 < hairLOD) RD.m('npc_hair', TMP2, n.colHair[0],n.colHair[1],n.colHair[2], 0, 0.5, 1, 0, 0);
        /* the hat reads at distance, so it keeps the wider LOD budget */
        if(n.hat) RD.m(HATS[n.hat], TMP2, n.colHat[0],n.colHat[1],n.colHat[2], 0, 0.5, 1, 0, 0);
      }
      if(d2 < legLOD){
        const sw = Math.sin(n.legPhase)*0.55;
        const mv = Math.hypot(n.vx,n.vz);
        const amp = clamp01(mv/1.5);
        for(const side of [-1,1]){
          const a = sw*side*amp;
          M4.trs(TMP2, n.x + Math.cos(ry)*0.105*side*s, hip, n.z - Math.sin(ry)*0.105*side*s, a, ry, 0, s,s,s);
          RD.m('npc_leg', TMP2, n.colPants[0],n.colPants[1],n.colPants[2], 0, 0.5, 1, 0, 0);
        }
      }
    }
    /* staff — same body, hi-vis vest and cap */
    for(const u of W.staffUnits){
      const gy = terrainH(u.x,u.z);
      const hip = gy + CH.hip + u.bob;
      M4.trsY(TMP, u.x, hip, u.z, u.dir, 1,1,1);
      RD.m('npc_body', TMP, u.colShirt[0],u.colShirt[1],u.colShirt[2], 0, 0.5,1,0,0);
      RD.m('npc_vest', TMP, 1,1,1, ATMO.night*0.7, 0.5,1,0,0);
      M4.trsY(TMP2, u.x, gy+CH.neck+u.bob, u.z, u.dir, 1,1,1);
      RD.m('npc_head', TMP2, u.colSkin[0],u.colSkin[1],u.colSkin[2], 0, 0.5,1,0,0);
      RD.m('npc_hair', TMP2, u.colHair[0],u.colHair[1],u.colHair[2], 0, 0.5,1,0,0);
      RD.m('npc_cap', TMP2, 1.0,0.88,0.29, ATMO.night*0.5, 0.5,1,0,0);
      const sw = Math.sin(u.legPhase)*0.5;
      for(const side of [-1,1]){
        M4.trs(TMP2, u.x + Math.cos(u.dir)*0.105*side, hip, u.z - Math.sin(u.dir)*0.105*side, sw*side, u.dir, 0, 1,1,1);
        RD.m('npc_leg', TMP2, u.colPants[0],u.colPants[1],u.colPants[2], 0, 0.5,1,0,0);
      }
      RD.decal(u.x, u.z, 0.9,0.9, 0, 0.25,0.85,0.95, 0.4, 1, 0.1, 0);
    }
  },
  /* --------------- world-space DOM labels --------------- */
  getLabel(){
    let n = this.labelPool.pop();
    if(!n){
      n = el('div',{ style:{
        position:'absolute', transform:'translate(-50%,-100%)', padding:'2px 7px', borderRadius:'8px',
        background:'rgba(6,13,26,.88)', border:'1px solid rgba(120,190,255,.28)',
        font:'700 11px var(--mono)', color:'#e8f2ff', whiteSpace:'nowrap',
        pointerEvents:'none', backdropFilter:'blur(4px)'
      }});
      this.labelRoot.appendChild(n);
    }
    n.style.display = 'block';
    return n;
  },
  updateLabels(){
    for(const l of this.labels){ l.style.display='none'; this.labelPool.push(l); }
    this.labels.length = 0;
    if(CAM.mode !== 'overview' || W.stage === 'title') return;
    const show = [];
    for(const f of W.facilities){
      if(f.def.noQueue || !f.def.queueMax) continue;
      if(!f.queue.length && !(BUILD.hovered===f || BUILD.selected===f)) continue;
      show.push(f);
    }
    show.sort((a,b)=>b.queue.length-a.queue.length);
    for(let i=0;i<Math.min(show.length, 22);i++){
      const f = show[i];
      const h = f.def.mesh==='mainstage'?11:(f.def.mesh==='smallstage'?6.4:3.4);
      const p = CAM.projectToScreen(f.x, terrainH(f.x,f.z)+h, f.z);
      if(!p || p.x<-100 || p.x>innerWidth+100 || p.y<-40 || p.y>innerHeight+40) continue;
      const n = this.getLabel();
      const q = f.queue.length, m = f.def.queueMax;
      const ratio = q/m;
      const col = ratio>0.8?'#ff5f6d':(ratio>0.5?'#ffb020':'#4ee39a');
      const wait = f.waitN ? Math.round(f.waitSum/f.waitN) : 0;
      n.innerHTML = '<span style="color:'+col+'">'+(ratio>0.8?'▲':(ratio>0.5?'●':'▼'))+'</span> '
        + q + '/' + m + (wait? ' <span style="opacity:.6">'+wait+'m</span>':'');
      n.style.left = p.x+'px'; n.style.top = p.y+'px';
      this.labels.push(n);
    }
    /* event labels */
    for(const ev of W.events){
      if(ev.done) continue;
      const p = CAM.projectToScreen(ev.x, terrainH(ev.x,ev.z)+3.2, ev.z);
      if(!p) continue;
      const n = this.getLabel();
      const need = ev.def.staff - ev.assigned;
      n.innerHTML = ev.def.g + ' ' + (ev.working ? '<span style="color:#4fe8c0">'+Math.round(ev.workT/ev.def.dur*100)+'%</span>'
                    : (need>0 ? '<span style="color:#ff5f6d">'+T('스태프','Staff')+' '+need+'</span>' : '…'));
      n.style.left = p.x+'px'; n.style.top = p.y+'px';
      this.labels.push(n);
    }
  },
  hide(){ for(const l of this.labels){ l.style.display='none'; this.labelPool.push(l); } this.labels.length=0; }
};
/* ===========================================================================
   32. BUILD / PLACEMENT
   =========================================================================== */
const BUILD = {
  mode:null,          // null | defId | '__remove'
  rot:0,
  cell:null,          // {c,r}
  valid:'OK',
  hovered:null, selected:null,
  canBuild(){ return W.stage==='setup' || W.stage==='morning'; },
  setMode(defId){
    if(this.mode === defId){ this.mode = null; }
    else this.mode = defId;
    this.rot = 0;
    this.selected = null;
    AUDIO.sfx('click');
    UI.refreshBuildList();
    UI.refreshPlaceBar();
  },
  cancel(){ this.mode = null; this.selected = null; UI.refreshBuildList(); UI.refreshPlaceBar(); },
  rotate(d){
    if(!this.mode || this.mode==='__remove') return;
    this.rot = mod(this.rot + (d||1), 4);
    AUDIO.sfx('hover');
    UI.refreshPlaceBar();
  },
  update(){
    this.hovered = null;
    if(UI.modalOpen || CAM.mode!=='overview' || W.stage==='title'){ this.cell = null; return; }
    if(IN.overUI){ this.cell = null; return; }
    const hit = CAM.groundPick(IN.mx, IN.my, 0);
    if(!hit){ this.cell = null; return; }
    this.pickX = hit.x; this.pickZ = hit.z;
    /* hovered facility */
    const c = worldToCol(hit.x), r = worldToRow(hit.z);
    const fid = occAt(c,r);
    if(fid > 0) this.hovered = facById(fid);
    if(this.mode && this.mode !== '__remove'){
      const def = FAC[this.mode];
      const { w:fw, h:fh } = footprint(def, this.rot);
      const c0 = Math.round((hit.x - GRID.x0)/GRID.cell - fw/2);
      const r0 = Math.round((hit.z - GRID.z0)/GRID.cell - fh/2);
      this.cell = { c:c0, r:r0, fw, fh };
      this.valid = validatePlacement(this.mode, c0, r0, this.rot, null);
      if(this.valid === 'OK' && !W.canAfford(def.cost)) this.valid = 'NO_GOLD';
      if(!this.canBuild()) this.valid = 'BAD_STAGE';
    } else this.cell = null;
    /* interactions */
    if(IN.clicked[0]){
      if(this.mode === '__remove'){
        if(this.hovered && !this.hovered.def.fixed){
          const res = removeFacility(this.hovered);
          if(res.ok){ AUDIO.sfx('cash'); FX.pushToast('♻️ '+T('철거 · 환급','Removed · refund')+' <b class="gold-t">+'+fmtInt(res.refund)+'</b>','ok');
                      FX.burst(this.hovered.x, this.hovered.z, '#8fb0cc', 16); NAV.rebuildStatic(); }
          else { AUDIO.sfx('error'); FX.pushToast('⛔ '+reasonText(res.reason),'err'); }
        } else if(this.hovered && this.hovered.def.fixed){ AUDIO.sfx('error'); FX.pushToast('⛔ '+reasonText('IS_FIXED'),'err'); }
      } else if(this.mode){
        this.tryPlace();
      } else {
        this.selected = this.hovered;
        if(this.selected) AUDIO.sfx('click');
        UI.refreshInspector();
      }
    }
    if(IN.clicked[2] && this.mode){ this.cancel(); }
    if(IN.wheel && this.mode && this.mode!=='__remove' && IN.key('Shift')) this.rotate(sign(IN.wheel));
  },
  tryPlace(){
    if(!this.cell) return;
    if(this.valid !== 'OK'){
      AUDIO.sfx('error');
      FX.pushToast('⛔ '+reasonText(this.valid), 'err');
      FX.camShake(0.12, 0.16);
      return;
    }
    const res = placeFacility(this.mode, this.cell.c, this.cell.r, this.rot, false);
    if(res.ok){
      AUDIO.sfx('place');
      const f = res.f;
      FX.burst(f.x, f.z, f.def.color, 22, 0.4);
      FX.floatWorld(f.x, f.z, '-'+fmtInt(res.cost), '#ff9b6b', 3.4);
      FX.camShake(0.09, 0.14);
      Tutorial.notify('placed', this.mode);
      if(!IN.key('Shift')) { /* keep placing by default; Shift+click to stop */ }
      UI.refreshBuildList();
    } else {
      AUDIO.sfx('error');
      FX.pushToast('⛔ '+reasonText(res.reason), 'err');
    }
  },
  draw(){
    /* build grid when placing */
    if(this.mode && this.mode!=='__remove' && this.canBuild()){
      const def = FAC[this.mode];
      /* faint grid around the cursor */
      const cc = worldToCol(this.pickX||0), cr = worldToRow(this.pickZ||0);
      for(let r=cr-4;r<=cr+4;r++) for(let c=cc-5;c<=cc+5;c++){
        if(!inGrid(c,r)) continue;
        const occ = occAt(c,r), lane = inLane(c,r);
        let col = [0.55,0.75,0.95], a = 0.10;
        if(occ){ col=[0.9,0.5,0.4]; a=0.13; }
        else if(lane){ col=[0.35,0.72,1]; a=0.16; }
        RD.decal(cellCX(c), cellCZ(r), GRID.cell/2-0.14, GRID.cell/2-0.14, 0, col[0],col[1],col[2], a, 0, 0.16, c*0.4+r*0.7);
      }
      if(this.cell){
        const ctr = facCenter(this.cell.c, this.cell.r, this.cell.fw, this.cell.fh);
        const ok = this.valid === 'OK';
        const ry = this.rot*PI/2;
        const col = hex2rgb(def.color);
        M4.trsY(TMP, ctr.x, terrainH(ctr.x,ctr.z), ctr.z, ry, 1,1,1);
        RD.m(def.mesh, TMP, col[0],col[1],col[2], ok?0.6:0.2, 0.6, 1, 0, ok?2:4);
        RD.decal(ctr.x, ctr.z, this.cell.fw*GRID.cell/2, this.cell.fh*GRID.cell/2, 0,
                 ok?0.25:1, ok?0.95:0.25, ok?0.85:0.3, 0.55, 0, 0.10, 0);
        /* queue preview */
        if(!def.noQueue && def.queueMax){
          const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
          const [dx,dz] = dirs[this.rot];
          const depth = (this.rot===1||this.rot===3)?def.w:def.h;
          const front = depth*GRID.cell/2 + 1.5;
          for(let i=0;i<Math.min(def.queueMax,8);i++){
            const px = ctr.x + dx*(front+i*1.15), pz = ctr.z + dz*(front+i*1.15);
            RD.decal(px, pz, 0.42,0.42, 0, 0.3,0.85,0.95, 0.24*(1-i/10), 2, 0.1, i);
          }
          RD.decal(ctr.x + dx*(front+2.2), ctr.z + dz*(front+2.2), 1.1, 2.6, Math.atan2(dx,dz),
                   0.3,0.9,1, 0.30, 3, 0.1, 0);
        }
      }
    }
    /* remove mode */
    if(this.mode === '__remove' && this.hovered && !this.hovered.def.fixed){
      const f = this.hovered;
      RD.decal(f.x, f.z, f.fw*GRID.cell/2, f.fh*GRID.cell/2, 0, 1,0.3,0.3, 0.5, 0, 0.12, 0);
    }
    /* selection ring */
    if(this.selected){
      const f = this.selected;
      RD.decal(f.x, f.z, Math.max(f.fw,f.fh)*GRID.cell*0.62, Math.max(f.fw,f.fh)*GRID.cell*0.62, 0,
               0.3,0.95,0.85, 0.6, 1, 0.1, 0);
    }
    /* hover ring */
    if(this.hovered && this.hovered !== this.selected && !this.mode){
      const f = this.hovered;
      RD.decal(f.x, f.z, Math.max(f.fw,f.fh)*GRID.cell*0.58, Math.max(f.fw,f.fh)*GRID.cell*0.58, 0,
               0.8,0.9,1, 0.28, 1, 0.1, 0);
    }
  }
};
/* ===========================================================================

const UI = {
  modalOpen:false, typing:false, heatLayer:-1, legendOn:false,
  els:{},
  init(){
    this.tipEl = $('#tip');
    $('#ui').classList.remove('hide');
    /* pointer-over-UI detection */
    document.addEventListener('mousemove', e=>{
      const t = e.target;
      IN.overUI = !!(t && t !== CV && t.closest && (t.closest('#ui') || t.closest('#modalroot') || t.closest('#coach')));
    });
    this.rebuild();
  },
  /* ---------- tooltip ---------- */
  tip(node, fn){
    node.addEventListener('mouseenter', ()=>{
      const html = typeof fn==='function'?fn():fn;
      if(!html) return;
      this.tipEl.innerHTML = html;
      this.tipEl.classList.add('on');
      this._tipNode = node;
      this.positionTip();
    });
    node.addEventListener('mousemove', ()=>{ if(this._tipNode===node) this.positionTip(); });
    node.addEventListener('mouseleave', ()=>{ this.tipEl.classList.remove('on'); this._tipNode=null; });
    return node;
  },
  positionTip(){
    const t = this.tipEl, r = t.getBoundingClientRect();
    let x = IN.mx + 16, y = IN.my + 16;
    if(x + r.width > innerWidth-12) x = IN.mx - r.width - 14;
    if(y + r.height > innerHeight-12) y = IN.my - r.height - 14;
    t.style.left = Math.max(8,x)+'px'; t.style.top = Math.max(8,y)+'px';
  },
  /* ---------- full rebuild ---------- */
  rebuild(){
    this.buildTopbar();
    this.buildLeft();
    this.buildDock();
    this.buildRight();
    this.refreshPlaceBar();
    this.refreshLegend();
  },
  /* ---------- top bar ---------- */
  buildTopbar(){
    const tb = $('#topbar');
    tb.innerHTML = '';
    const live = W.stage==='live';
    tb.appendChild(el('div',{class:'tb-group tb-brand'},
      el('b',{text:'Festa Fiesta!'}),
      el('span',{text:LANG==='ko'?'부산 바다축제':'Busan Sea Festival'})
    ));
    /* stage + day */
    const stageChip = el('div',{class:'stage-chip'+(live?' live':'')},
      el('i',{class:'dot'}), el('span',{id:'stagetxt',text:stageName(W.stage)}));
    tb.appendChild(el('div',{class:'tb-group'},
      stageChip,
      el('div',{class:'clock'}, el('b',{id:'daytxt',text:'DAY '+W.day}), el('span',{text:'/ 3'}))
    ));
    /* clock + slots */
    const dots = el('div',{class:'slotdots',id:'slotdots'});
    for(let i=0;i<4;i++) dots.appendChild(el('i',{class:'slotdot'}));
    tb.appendChild(el('div',{class:'tb-group'},
      el('div',{class:'clock'}, el('b',{id:'clocktxt',text:fmtClock(W.clock)}),
        el('span',{id:'slottxt',text:T('슬롯','Slot')+' '+(W.slot+1)+'/4'})),
      dots
    ));
    /* resources */
    const goldEl = el('div',{class:'res gold',id:'goldres'},
      el('span',{class:'ico',text:'◆'}), el('b',{id:'goldtxt',text:fmtInt(W.gold)}));
    this.tip(goldEl, ()=>{
      let up=0,dn=0;
      for(const e of W.dayLedger){ if(e.amount>0) up+=e.amount; else dn-=e.amount; }
      return '<h4>💰 '+T('금화','Gold')+'</h4>'
        +'<div class="row"><span>'+T('오늘 수입','Income today')+'</span><b style="color:var(--ok)">+'+fmtInt(up)+'</b></div>'
        +'<div class="row"><span>'+T('오늘 지출','Spent today')+'</span><b style="color:var(--danger)">-'+fmtInt(dn)+'</b></div>'
        +'<div class="row"><span>'+T('일일 목표','Daily goal')+'</span><b>'+fmtInt(BAL.dayGoals[clamp(W.day-1,0,2)])+'</b></div>'
        +'<div class="row"><span>'+T('누적 수익','Total revenue')+'</span><b>'+fmtInt(W.revenueTotal+W.revenueToday)+'</b></div>';
    });
    const staffEl = el('div',{class:'res staff',id:'staffres'},
      el('span',{class:'ico',text:'☗'}), el('b',{id:'stafftxt',text:W.freeStaff()+'/'+W.staff}));
    this.tip(staffEl, ()=>
      '<h4>👷 '+T('스태프','Staff')+'</h4>'
      +'<div class="row"><span>'+T('가용','Available')+'</span><b>'+W.freeStaff()+'</b></div>'
      +'<div class="row"><span>'+T('출동 중','Deployed')+'</span><b>'+W.staffBusy+'</b></div>'
      +'<div class="row"><span>'+T('프로그램 배정','On programs')+'</span><b>'+programStaffUsed()+'</b></div>'
      +'<div class="row"><span>'+T('일일 임금','Daily wage')+'</span><b>'+fmtInt(BAL.wagePerStaff*W.staff)+'</b></div>');
    tb.appendChild(el('div',{class:'tb-group'}, goldEl, staffEl));
    /* metrics */
    const mk = (id, cls, g, lab) => {
      const n = el('div',{class:'metric '+cls, id:'m_'+id},
        el('div',{class:'lab'}, el('span',{class:'g',text:g}), el('span',{text:lab})),
        el('div',{class:'val'}, el('span',{class:'v',text:'0'}), el('span',{class:'d'})),
        el('div',{class:'bar'}, el('i')));
      return n;
    };
    const metrics = el('div',{class:'metrics'},
      mk('sat','sat','☺',T('만족도','SAT')),
      mk('saf','saf','⛨',T('안전','SAFE')),
      mk('buzz','buzz','◈',T('버즈','BUZZ')),
      mk('rev','rev','₩',T('수익','REV')));
    this.tip($('#m_sat')||metrics.children[0], ()=>{
      const tops = METRIC_CAUSE.top('sat',6);
      let h = '<h4>☺ '+T('만족도','Satisfaction')+'</h4><div class="sub">'+T('현재 방문객 평균 체감','Live average across visitors')+'</div>';
      if(!tops.length) h += '<div class="row"><span>'+T('아직 데이터 없음','No data yet')+'</span><b>—</b></div>';
      for(const [c,v] of tops) h += '<div class="row"><span>'+causeGlyph(c)+' '+causeLabel(c)+'</span><b style="color:'+(v>0?'var(--ok)':'var(--danger)')+'">'+(v>0?'+':'')+v.toFixed(1)+'</b></div>';
      return h;
    });
    this.tip(metrics.children[1], ()=>{
      const tops = METRIC_CAUSE.top('safety',5);
      let h = '<h4>⛨ '+T('안전도','Safety')+'</h4>';
      for(const [c,v] of tops) h += '<div class="row"><span>'+causeGlyph(c)+' '+causeLabel(c)+'</span><b style="color:'+(v>0?'var(--ok)':'var(--danger)')+'">'+(v>0?'+':'')+v.toFixed(1)+'</b></div>';
      if(!tops.length) h += '<div class="row"><span>'+T('안정적','Stable')+'</span><b>OK</b></div>';
      return h;
    });
    this.tip(metrics.children[2], ()=>
      '<h4>◈ '+T('버즈','Buzz')+'</h4><div class="sub">'+T('SNS 화제성 — 다음 슬롯 방문객 수에 직접 영향','Social heat — directly drives next slot arrivals')+'</div>'
      +'<div class="row"><span>'+T('다음 슬롯 예상','Next slot forecast')+'</span><b>'+fmtInt(slotArrivalTarget())+T('명','')+'</b></div>');
    this.tip(metrics.children[3], ()=>
      '<h4>₩ '+T('오늘 수익','Revenue today')+'</h4>'
      +'<div class="row"><span>'+T('목표','Goal')+'</span><b>'+fmtInt(BAL.dayGoals[clamp(W.day-1,0,2)])+'</b></div>'
      +'<div class="row"><span>'+T('달성 시 보너스','Bonus if met')+'</span><b class="gold-t">+'+fmtInt(BAL.goalBonus)+'</b></div>');
    tb.appendChild(el('div',{class:'tb-group'}, metrics));
    /* speed */
    const speeds = el('div',{class:'speeds', id:'speeds'});
    [['⏸',0],['▶',1],['▶▶',2],['▶▶▶',4]].forEach(([lab,v])=>{
      const b = el('button',{ 'data-sp':v, text:lab, onclick:()=>this.setSpeed(v) });
      speeds.appendChild(b);
      this.tip(b, ()=> v===0 ? T('일시정지','Pause')+' <span class="kbd">Space</span>' : T('배속','Speed')+' x'+v+' <span class="kbd">'+(v===1?'1':(v===2?'2':'3'))+'</span>');
    });
    const g = el('div',{class:'tb-group'}, speeds);
    if(!(W.stage==='live')) speeds.style.opacity = '0.35';
    tb.appendChild(g);
    /* buttons */
    const mkb = (icon, title, fn, id) => {
      const b = el('button',{class:'iconbtn', text:icon, id, onclick:()=>{ AUDIO.sfx('click'); fn(); }});
      this.tip(b, title); return b;
    };
    tb.appendChild(el('div',{class:'tb-group'},
      mkb('🌐', T('언어 전환','Switch language')+' <span class="kbd">L</span>', ()=>toggleLang()),
      mkb('❓', T('도움말','Help')+' <span class="kbd">H</span>', ()=>UI.openHelp()),
      mkb('⚙', T('설정','Settings')+' <span class="kbd">Esc</span>', ()=>UI.openSettings())
    ));
  },
  setSpeed(v){
    if(W.stage!=='live') return;
    if(v>1 && W.isShowWindow()){
      FX.pushToast('🎤 '+T('메인 공연 중에는 x1로 고정됩니다','Speed locked to x1 during the main show'),'warn');
      v = 1;
    }
    W.speed = v; W.paused = (v===0);
    AUDIO.sfx('click');
    this.refreshSpeed();
  },
  refreshSpeed(){
    const s = $('#speeds'); if(!s) return;
    const showLock = W.isShowWindow();
    for(const b of s.children){
      const v = +b.dataset.sp;
      b.classList.toggle('on', W.paused ? v===0 : v===W.speed);
      b.classList.toggle('locked', showLock && v>1);
      b.disabled = W.stage!=='live' || (showLock && v>1);
    }
    s.style.opacity = W.stage==='live' ? '1' : '0.35';
  },
  /* ---------- left column ---------- */
  buildLeft(){
    const L = $('#leftcol');
    L.innerHTML = '';
    if(W.stage==='title'){ return; }
    const building = BUILD.canBuild();
    L.appendChild(building ? this.buildPanel() : this.opsPanel());
    L.appendChild(el('div',{id:'inspector',class:'panel hide'}));
    /* populate now that the panel is in the document */
    if(building){ this.refreshBuildList(); this.refreshNextBtn(); } else this.refreshOps();
    this.refreshInspector();
  },
  buildPanel(){
    const p = el('div',{class:'panel',id:'buildpanel'});
    p.appendChild(el('h3',{class:'panel-t',text:T('시설 배치','BUILD')}));
    const tabs = el('div',{class:'cat-tabs',id:'cattabs'});
    this.cat = this.cat || 'food';
    for(const c of CATS){
      const b = el('button',{ text:(LANG==='ko'?c.ko:c.en), 'data-cat':c.id,
        onclick:()=>{ this.cat=c.id; AUDIO.sfx('hover'); this.refreshBuildList(); } });
      if(c.id===this.cat) b.classList.add('on');
      tabs.appendChild(b);
    }
    p.appendChild(tabs);
    p.appendChild(el('div',{class:'build-list',id:'buildlist'}));
    const foot = el('div',{class:'build-foot'});
    foot.appendChild(el('div',{class:'hintrow',html:
      '<span><span class="kbd">R</span> '+T('회전','Rotate')+'</span>'+
      '<span><span class="kbd">X</span> '+T('철거','Demolish')+'</span>'+
      '<span><span class="kbd">Esc</span> '+T('취소','Cancel')+'</span>'}));
    const rm = el('button',{class:'btn wide sm'+(BUILD.mode==='__remove'?' dan':''), id:'rmbtn',
      html:'♻️ '+T('철거 모드','Demolish mode')+' <span class="k">X</span>',
      onclick:()=>{ BUILD.setMode('__remove'); }});
    foot.appendChild(rm);
    const nextBtn = el('button',{class:'btn pri wide', id:'nextstage', onclick:()=>this.nextStage()});
    foot.appendChild(nextBtn);
    p.appendChild(foot);
    return p;
  },
  refreshNextBtn(){
    const b = $('#nextstage'); if(!b) return;
    if(W.stage==='setup') b.innerHTML = T('홍보 단계로','To promotion')+' →';
    else if(W.stage==='morning') b.innerHTML = '🎪 '+T('개장하기','Open the gates')+' →';
    else b.innerHTML = '→';
  },
  nextStage(){
    AUDIO.sfx('open');
    if(W.stage==='setup'){
      if(W.facilities.filter(f=>!f.def.fixed).length < 3){
        FX.pushToast('⛔ '+T('최소 3개 이상의 시설을 배치하세요','Place at least 3 facilities first'),'err');
        AUDIO.sfx('error'); return;
      }
      BUILD.cancel();
      setStage('promotion'); this.openPromotion();
    } else if(W.stage==='morning'){
      BUILD.cancel();
      this.closeModal();
      openGates();
    }
  },
  refreshBuildList(){
    const list = $('#buildlist'); if(!list) return;
    list.innerHTML = '';
    const items = FAC_LIST.filter(f=>f.cat===this.cat);
    for(const d of items){
      const afford = W.canAfford(d.cost);
      const it = el('button',{class:'bitem'+(BUILD.mode===d.id?' on':'')+(afford?'':' cant'),
        onclick:()=>{ if(!afford){ AUDIO.sfx('error'); FX.pushToast('⛔ '+reasonText('NO_GOLD'),'err'); return; } BUILD.setMode(d.id); }},
        el('span',{class:'g',text:d.g}),
        el('span',{class:'tx'}, el('b',{text:facName(d)}), el('span',{text:this.facSummary(d)})),
        el('span',{class:'pr'}, fmtInt(d.cost), d.upkeep?el('small',{text:'-'+d.upkeep+'/d'}):null)
      );
      if(d.essential && !W.facilities.some(f=>f.defId===d.id)) it.appendChild(el('span',{class:'badge',text:T('필수','KEY')}));
      this.tip(it, ()=>this.facTip(d));
      list.appendChild(it);
    }
    const rm = $('#rmbtn');
    if(rm) rm.classList.toggle('dan', BUILD.mode==='__remove');
    const cnt = $('#cattabs');
    if(cnt) for(const b of cnt.children) b.classList.toggle('on', b.dataset.cat===this.cat);
  },
  facSummary(d){
    const bits = [];
    bits.push(d.w+'×'+d.h);
    if(d.rev) bits.push('₩'+Math.round(d.rev*BAL.revScale));
    if(d.queueMax) bits.push('◷'+d.queueMax);
    if(d.progSlots) bits.push('🎭'+d.progSlots);
    return bits.join(' · ');
  },
  facTip(d){
    let h = '<h4>'+d.g+' '+facName(d)+'</h4>';
    h += '<div class="sub">'+facDesc(d)+'</div>';
    h += '<div class="row"><span>'+T('설치비','Build cost')+'</span><b class="gold-t">'+fmtInt(d.cost)+'</b></div>';
    if(d.upkeep) h += '<div class="row"><span>'+T('일일 유지비','Daily upkeep')+'</span><b>-'+fmtInt(d.upkeep)+'</b></div>';

  opsPanel(){
    const p = el('div',{class:'panel',id:'buildpanel'});
    p.appendChild(el('h3',{class:'panel-t',text:T('운영 현황','OPERATIONS')}));
    p.appendChild(el('div',{class:'build-list',id:'opslist'}));

    foot.appendChild(el('div',{class:'hintrow',id:'opshint',html:''}));
    p.appendChild(foot);

  },
  refreshOps(){
    const list = $('#opslist'); if(!list) return;
    const facs = W.facilities.filter(f=>!f.def.fixed || f.defId==='mainstage');
    facs.sort((a,b)=>(b.queue.length/(b.def.queueMax||1)) - (a.queue.length/(a.def.queueMax||1)));
    if(list.children.length !== facs.length) list.innerHTML = '';
    facs.forEach((f,i)=>{
      let it = list.children[i];
      if(!it){
        it = el('div',{class:'bitem'}, el('span',{class:'g'}), el('span',{class:'tx'}, el('b'), el('span')), el('span',{class:'pr'}));
        it.addEventListener('click', ()=>{ BUILD.selected=f; CAM.ttx=f.x; CAM.ttz=f.z; AUDIO.sfx('click'); this.refreshInspector(); });
        this.tip(it, ()=>this.facInstTip(f));
        list.appendChild(it);
      }
      it._f = f;
      it.children[0].textContent = f.def.g;
      it.children[1].children[0].textContent = facName(f.def);
      const q = f.queue.length, m = f.def.queueMax||0;
      const wait = f.waitN ? Math.round(f.waitSum/f.waitN) : 0;
      it.children[1].children[1].innerHTML = m
        ? (T('대기','Q')+' '+q+'/'+m+' · '+T('평균','avg')+' '+wait+T('분','m')+' · '+T('이용','used')+' '+f.uses)
        : (T('이용','used')+' '+f.uses);
      it.children[2].innerHTML = f.revenue ? '<span class="gold-t">+'+fmtInt(f.revenue)+'</span>' : '<span class="muted">—</span>';
      const ratio = m ? q/m : 0;
      it.style.borderColor = !f.active ? 'rgba(255,95,109,.6)' : (ratio>0.8?'rgba(255,95,109,.45)':(ratio>0.5?'rgba(255,176,32,.4)':'transparent'));
      it.classList.toggle('on', BUILD.selected===f);
    });
    while(list.children.length > facs.length) list.removeChild(list.lastChild);
    const hint = $('#opshint');
    if(hint) hint.innerHTML = '<span>'+T('현장 인원','On site')+' <b class="emph">'+W.npcs.length+'</b></span>'
      + '<span>'+T('오늘 방문','Today')+' <b class="emph">'+fmtInt(W.visitorsToday)+'</b></span>'
      + '<span>'+T('예상','Forecast')+' <b class="emph">'+fmtInt(W.slotTargetArrivals||0)+'</b></span>';
  },
  facInstTip(f){
    const d = f.def;
    let h = '<h4>'+d.g+' '+facName(d)+'</h4>';
    if(!f.active) h += '<div class="warnline">⛔ '+T('운영 중단 (정전)','Offline (power outage)')+'</div>';
    h += '<div class="row"><span>'+T('이용 횟수','Uses')+'</span><b>'+f.uses+'</b></div>';
    h += '<div class="row"><span>'+T('오늘 매출','Revenue today')+'</span><b class="gold-t">+'+fmtInt(f.revenue)+'</b></div>';
    if(d.queueMax){
      h += '<div class="row"><span>'+T('현재 대기','Queue now')+'</span><b>'+f.queue.length+'/'+d.queueMax+'</b></div>';
      h += '<div class="row"><span>'+T('평균 대기','Avg wait')+'</span><b>'+(f.waitN?Math.round(f.waitSum/f.waitN):0)+T('분','m')+'</b></div>';
      h += '<div class="row"><span>'+T('대기 포기','Abandoned')+'</span><b style="color:'+(f.abandons>5?'var(--danger)':'inherit')+'">'+f.abandons+'</b></div>';
    }
    if(f.programs && f.programs.length){
      for(const p of f.programs) if(p)
        h += '<div class="row"><span>'+p.prog.g+' '+(LANG==='ko'?p.prog.ko:p.prog.en)+'</span><b>'+T('슬롯','Slot')+' '+(p.slot+1)+(p.done?' ✓':'')+'</b></div>';
    }
    return h;
  },
  refreshInspector(){
    const ins = $('#inspector'); if(!ins) return;
    const f = BUILD.selected;
    if(!f){ ins.classList.add('hide'); return; }
    ins.classList.remove('hide');
    ins.innerHTML = '';
    const d = f.def;
    ins.appendChild(el('div',{class:'ins-h'},
      el('span',{class:'g',text:d.g}),
      el('span',{}, el('b',{text:facName(d)}), el('span',{text:zoneAt(f.x,f.z)[LANG==='ko'?'ko':'en']})),
      el('button',{class:'iconbtn ins-close',text:'✕',onclick:()=>{ BUILD.selected=null; this.refreshInspector(); }})
    ));
    const stat = (k,v,bar,col)=>{
      const n = el('div',{class:'statrow'}, el('span',{text:k}), el('b',{html:v}));
      ins.appendChild(n);
      if(bar!==undefined) ins.appendChild(el('div',{class:'minibar'}, el('i',{style:{width:clamp01(bar)*100+'%',background:col||'var(--accent)'}})));
    };
    if(d.queueMax) stat(T('대기열','Queue'), f.queue.length+'/'+d.queueMax, f.queue.length/d.queueMax,
                        f.queue.length/d.queueMax>0.7?'var(--danger)':'var(--accent)');
    stat(T('이용','Uses'), String(f.uses));
    if(d.rev) stat(T('매출','Revenue'), '<span class="gold-t">'+fmtInt(f.revenue)+'</span>');
    if(d.queueMax) stat(T('포기','Abandons'), String(f.abandons));
    if(d.progSlots){
      ins.appendChild(el('div',{class:'divider'}));
      for(let i=0;i<d.progSlots;i++){
        const p = f.programs[i];
        const b = el('button',{class:'btn sm wide',style:{marginTop:'5px'},
          html: p ? (p.prog.g+' '+(LANG==='ko'?p.prog.ko:p.prog.en)+' <span class="k">'+T('슬롯','S')+(p.slot+1)+'</span>')
                  : ('＋ '+T('프로그램 편성','Add program')),
          onclick:()=>{ if(!p) this.openProgramPicker(f,i); }});
        if(p) b.classList.add('pri');
        b.disabled = !!p || !BUILD.canBuild();
        ins.appendChild(b);
      }
    }
    if(d.minigame && W.stage==='live'){
      const g = MINIGAME_BY[d.minigame];
      const st = minigameStatus(g);
      const btn = el('button',{class:'btn gold wide',style:{marginTop:'8px'},
        html:g.g+' '+(LANG==='ko'?g.ko:g.en),
        onclick:()=>MINI.start(d.minigame, f)});
      btn.disabled = !st.ok;
      this.tip(btn, ()=> st.ok ? (LANG==='ko'?g.desc.ko:g.desc.en) : st.why);
      ins.appendChild(btn);
    }
    if(!d.fixed && BUILD.canBuild()){
      ins.appendChild(el('button',{class:'btn sm wide ghost',style:{marginTop:'8px'},
        html:'♻️ '+T('철거','Demolish')+' <span class="k">+'+fmtInt(Math.floor(d.cost*0.6))+'</span>',
        onclick:()=>{
          const res = removeFacility(f);
          if(res.ok){ AUDIO.sfx('cash'); BUILD.selected=null; NAV.rebuildStatic(); this.refreshInspector(); this.refreshBuildList(); }
          else { AUDIO.sfx('error'); FX.pushToast('⛔ '+reasonText(res.reason),'err'); }
        }}));
    }
  }
};
function NEEDLBL(k){
  const M = { hunger:['허기','Hunger'], thirst:['갈증','Thirst'], restroom:['화장실','Restroom'],
              fun:['즐거움','Fun'], rest:['휴식','Rest'], shop:['쇼핑','Shopping'],
              cool:['더위 해소','Cooling'], photo:['사진','Photo'] };
  return (M[k]||[k,k])[LANG==='ko'?0:1];
}

      [T('대기열 압력','Queue pressure'), [[T('짧음','Short'),'#0d59d9'],[T('보통','Fair'),'#1ad99e'],[T('길어짐','Growing'),'#fad33d'],[T('심각','Severe'),'#ff6b29'],[T('폭주','Overflow'),'#fa1a47']]],
